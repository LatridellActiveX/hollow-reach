    mctx.beginPath(); mctx.arc(x, y, 5, 0, TAU); mctx.fill();
  }
  const [stx, sty] = P2(0, 0);
  mctx.fillStyle = '#3ea6ff';
  mctx.beginPath(); mctx.arc(stx, sty, 4, 0, TAU); mctx.fill();
  mctx.fillStyle = 'rgba(200,180,130,0.8)';
  for (const a of world.asts) { const [x, y] = P2(a.x, a.y); mctx.fillRect(x - 1, y - 1, 2, 2); }
  mctx.fillStyle = '#ff6b6b';
  for (const n of world.npcs) { const [x, y] = P2(n.x, n.y); mctx.beginPath(); mctx.arc(x, y, 3, 0, TAU); mctx.fill(); }
  mctx.fillStyle = '#7fffd4';
  for (const d of world.drones) { const [x, y] = P2(d.x, d.y); mctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
  mctx.save();
  mctx.translate(c, c); mctx.rotate(ship.heading);
  mctx.fillStyle = '#ffffff';
  mctx.beginPath(); mctx.moveTo(8, 0); mctx.lineTo(-6, -5); mctx.lineTo(-3, 0); mctx.lineTo(-6, 5); mctx.closePath(); mctx.fill();
  mctx.restore();
  mctx.restore();
  mctx.strokeStyle = '#1d3350'; mctx.lineWidth = 3;
  mctx.beginPath(); mctx.arc(c, c, c - 2, 0, TAU); mctx.stroke();
}

// ============ HUD ============
function statusText() {
  if (joy.active) return 'Manual flight';
  if (R.mining && R.mineRef) return 'Mining ' + ORE[R.mineRef.ot].name;
  if (R.target) {
    const k = R.target.kind;
    if (k === 'npc') return 'Engaging pirate';
    if (k === 'ast') return 'Approaching ' + ORE[R.target.ref.ot].name;
    if (k === 'gate') return 'Warping to ' + SYS[R.target.to].name;
    return 'Docking';
  }
  if (R.route != null) return 'Autopilot to ' + SYS[R.route].name;
  if (R.autoMine && cargoUsed() >= st().cargoMax) return 'Cargo full';
  if (R.autoFire || R.autoMine) return 'Standby' + (R.autoFire ? ' · guns hot' : '');
  if (world.drones.length) return `${world.drones.length} drone(s) deployed`;
  return R.dest ? 'Moving' : 'Idle';
}

function hud() {
  const s = st();
  const sys = SYS[P.sysId];
  $('sysname').textContent = sys.name;
  $('sec').textContent = sys.sec.toFixed(1);
  $('sec').style.color = secColor(sys.sec);
  $('credits').textContent = fmt(P.credits) + ' cr';
  $('bsh').style.width = pct(P.shield, s.shMax);
  $('bhu').style.width = pct(P.hull, s.hullMax);
  $('bfu').style.width = pct(P.fuel, s.fuelMax);
  $('cargo').textContent = `Cargo ${cargoUsed()}/${s.cargoMax}`;
  $('status').textContent = R.panel ? '' : statusText();
  $('bFire').classList.toggle('on', R.autoFire);
  $('bMine').classList.toggle('on', R.autoMine);
  $('bMiss').querySelector('small').textContent = P.items.missile;
  $('bDrone').querySelector('small').textContent = world.drones.length + '/' + (P.items.cdrone + P.items.mdrone);
  $('bWarp').classList.toggle('on', R.route != null || (R.target && R.target.kind === 'gate'));
  $('bDock').classList.toggle('on', R.target && R.target.kind === 'station');
  $('bStop').classList.toggle('hide', !(R.target || R.dest || R.route != null || R.autoFire || R.autoMine));
}

// ============ panels ============
function openPanel(kind, title, html) {
  R.panel = kind;
  $('ptitle').textContent = title;
  $('pbody').innerHTML = html;
  $('panel').classList.remove('hide');
}

function closePanel() {
  const was = R.panel;
  R.panel = null;
  $('panel').classList.add('hide');
  if (was === 'station') {
    const d = Math.hypot(ship.x, ship.y);
    if (d < 130) {
      const a = Math.atan2(ship.y, ship.x);
      ship.x = Math.cos(a) * 130; ship.y = Math.sin(a) * 130;
    }
  }
  save();
}

// ============ docking bay: the live ship drawn into its own canvas ============
function drawDock() {
  const cv = $('dockc');
  if (!cv) return;
  const r = cv.getBoundingClientRect();
  const w = Math.round(r.width * DPR), h = Math.round(r.height * DPR);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const W2 = r.width, H2 = r.height;
  const cx = W2 / 2, cy = H2 / 2 + 8;

  const bg = g.createLinearGradient(0, 0, 0, H2);
  bg.addColorStop(0, '#0b1d33'); bg.addColorStop(1, '#05070d');
  g.fillStyle = bg; g.fillRect(0, 0, W2, H2);
  g.strokeStyle = 'rgba(62,166,255,0.08)'; g.lineWidth = 1;
  for (let x = 0; x < W2; x += 28) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H2); g.stroke(); }
  for (let y = 0; y < H2; y += 28) { g.beginPath(); g.moveTo(0, y); g.lineTo(W2, y); g.stroke(); }

  g.save();
  g.translate(cx, cy); g.rotate(R.time * 0.15);
  g.strokeStyle = 'rgba(62,166,255,0.35)'; g.lineWidth = 2; g.setLineDash([12, 10]);
  g.beginPath(); g.arc(0, 0, Math.min(W2, H2) * 0.42, 0, TAU); g.stroke();
  g.setLineDash([]);
  g.restore();
  const fl = g.createRadialGradient(cx, cy + H2 * 0.3, 0, cx, cy + H2 * 0.3, H2 * 0.6);
  fl.addColorStop(0, 'rgba(127,255,212,0.16)'); fl.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fl; g.fillRect(0, 0, W2, H2);

  // reuse the in-flight renderer with temporary state
  const keep = { x: ship.x, y: ship.y, vx: ship.vx, vy: ship.vy, h: ship.heading, aim: TUR.a, waim: WT.a, rec: WT.recoil, ctx };
  const nParts = world.parts.length;
  ctx = g;
  ship.x = 0; ship.y = 0; ship.vx = 0; ship.vy = 0; ship.heading = -0.35;
  TUR.a = -0.35 + Math.sin(R.time * 0.7) * 0.6;
  WT.a = -0.35 + Math.sin(R.time * 0.9) * 0.5;
  WT.recoil = 0;
  g.save();
  g.translate(cx, cy);
  g.scale(1.6, 1.6);
  drawShip();
  g.restore();
  ctx = keep.ctx;
  ship.x = keep.x; ship.y = keep.y; ship.vx = keep.vx; ship.vy = keep.vy; ship.heading = keep.h;
  TUR.a = keep.aim; WT.a = keep.waim; WT.recoil = keep.rec;
  world.parts.length = nParts;

  g.fillStyle = '#9ee6ff'; g.font = 'bold 11px system-ui'; g.textAlign = 'left';
  g.fillText('BAY 1 · DOCKED', 12, 18);
  g.fillStyle = '#7fffd4'; g.textAlign = 'right';
  g.fillText('● SYSTEMS NOMINAL', W2 - 12, 18);
}

function stationHTML() {
  const s = st();
  const sys = SYS[P.sysId];
  const col = secColor(sys.sec);
  const meter = (label, v, m, c) => `<div class="meter"><span>${label}</span>
    <div class="mbar"><i style="width:${pct(v, m)};background:${c};color:${c}"></i></div>
    <span>${fmt(v)}/${fmt(m)}</span></div>`;
  const stat = (k, v) => `<div class="stat"><span class="dim">${k}</span><b>${v}</b></div>`;
  const ores = ORE_KEYS.map(k => {
    const n = P.cargo[k], O = ORE[k];
    return `<div class="ore ${k}">
      <div><b style="color:rgb(${O.vein})">${O.name}</b>
        <div class="dim">${fmt(n)} units · ${unitPrice(k)} cr each</div></div>
      <div class="ovalue">${fmt(n * unitPrice(k))} cr</div>
      <button data-act="sell" data-k="${k}" ${n ? '' : 'disabled'}>Sell all</button></div>`;
  }).join('');
  const pips = lvl => Array.from({ length: 5 }, (_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('');
  const ups = UPG.map(u => {
    const lvl = P.levels[u.k];
    const max = lvl >= 5;
    const cost = u.base * (lvl + 1);
    return `<div class="up">
      <div><b>${u.name}</b><div class="dim">${u.desc}</div><div class="pips">${pips(lvl)}</div></div>
      <button data-act="buy" data-k="${u.k}" ${max || P.credits < cost ? 'disabled' : ''}>${max ? 'MAX' : fmt(cost) + ' cr'}</button></div>`;
  }).join('');
  const recipes = RECIPES.map(r => {
    const need = Object.entries(r.need).map(([k, v]) => `${v} ${ORE[k].name}`).join(', ');
    return `<div class="up">
      <div><b>${r.name}</b><div class="dim">Uses ${need} + ${fmt(r.cost)} cr</div><div class="dim">${r.desc}</div></div>
      <button data-act="mfg" data-k="${r.k}" ${canMake(r) ? '' : 'disabled'}>Build</button></div>`;
  }).join('');
  const rCost = Math.ceil((s.hullMax - P.hull) * 3);
  const fCost = Math.ceil((s.fuelMax - P.fuel) * 1.5);
  return `
    <div class="dock-head" style="border-color:${col}">
      <div><div class="dim">Docked at</div><div class="sname">${esc(sys.name)} Station</div>
        <div class="dim">Security <span style="color:${col};font-weight:700">${sys.sec.toFixed(1)}</span></div></div>
      <div class="cr"><div class="dim">Credits</div><b>${fmt(P.credits)}</b></div>
    </div>
    <canvas id="dockc" class="dockc"></canvas>
    <div class="sec"><h3>Ship status</h3>
      ${meter('Hull', P.hull, s.hullMax, '#e0524c')}
      ${meter('Shield', P.shield, s.shMax, '#3ea6ff')}
      ${meter('Fuel', P.fuel, s.fuelMax, '#7fd17f')}
      ${meter('Cargo', cargoUsed(), s.cargoMax, '#ffd166')}
      <div class="stats">
        ${stat('Weapon damage', Math.round(s.dmg))}
        ${stat('Mining rate', s.rate.toFixed(1) + '/s')}
        ${stat('Top speed', Math.round(s.speed))}
        ${stat('Warp cost', JUMP_FUEL + ' fuel')}
        ${stat('Max shield', s.shMax)}
        ${stat('Max hull', s.hullMax)}
        ${stat('Cargo hold', s.cargoMax)}
        ${stat('Fuel tank', s.fuelMax)}
        ${stat('Missiles', P.items.missile)}
        ${stat('Mining drones', P.items.mdrone)}
        ${stat('Combat drones', P.items.cdrone)}
        ${stat('Pirates downed', fmt(P.kills))}
        ${stat('Ore mined', fmt(P.mined))}
      </div>
    </div>
    <div class="sec"><h3>Market</h3>${ores}</div>
    <div class="sec"><h3>Factory</h3>${recipes}</div>
    <div class="sec"><h3>Services</h3>
      <div class="item"><div><b>Repair</b><div class="dim">Hull and shield to full</div></div>
        <button data-act="repair" ${rCost <= 0 || P.credits < rCost ? 'disabled' : ''}>${rCost > 0 ? fmt(rCost) + ' cr' : 'OK'}</button></div>
      <div class="item"><div><b>Refuel</b><div class="dim">Top up fuel</div></div>
        <button data-act="refuel" ${fCost <= 0 || P.credits < fCost ? 'disabled' : ''}>${fCost > 0 ? fmt(fCost) + ' cr' : 'OK'}</button></div>
    </div>
    <div class="sec"><h3>Hangar</h3>${ups}</div>
    <button class="wide good" data-act="undock">Undock</button>`;
}

function openStation() {
  openPanel('station', SYS[P.sysId].name + ' Station', stationHTML());
}

function refreshStation() {
  if (R.panel === 'station') $('pbody').innerHTML = stationHTML();
}

function sell(k) {
  const n = P.cargo[k];
  if (!n) return;
  const gain = n * unitPrice(k);
  P.credits += gain;
  P.cargo[k] = 0;
  R.fullWarn = false;
  SND.coin();
  log(`Sold ${n} ${ORE[k].name} for ${fmt(gain)} cr.`);
}

function buy(k) {
  const u = UPG.find(x => x.k === k);
  const lvl = P.levels[k];
  if (lvl >= 5) return;
  const cost = u.base * (lvl + 1);
  if (P.credits < cost) return;
  P.credits -= cost;
  P.levels[k]++;
  const s = st();
  if (k === 'armor') P.hull = Math.min(s.hullMax, P.hull + 40);
  if (k === 'shield') P.shield = Math.min(s.shMax, P.shield + 30);
  SND.buy();
  log(`Installed ${u.name} Lv ${P.levels[k]}.`);
}

function manufacture(key) {
  const r = RECIPES.find(x => x.k === key);
  if (!r) return;
  if (!canMake(r)) { SND.error(); log('Missing ore or credits.'); return; }
  for (const k in r.need) P.cargo[k] -= r.need[k];
  P.credits -= r.cost;
  for (const k in r.out) P.items[k] = (P.items[k] || 0) + r.out[k];
  SND.mfg();
  log(`Manufactured ${r.name}.`);
}

function repair() {
  const s = st();
  const cost = Math.ceil((s.hullMax - P.hull) * 3);
  if (cost <= 0 || P.credits < cost) return;
  P.credits -= cost;
  P.hull = s.hullMax; P.shield = s.shMax;
  SND.buy();
  log(`Hull repaired for ${fmt(cost)} cr.`);
}

function refuel() {
  const s = st();
  const cost = Math.ceil((s.fuelMax - P.fuel) * 1.5);
  if (cost <= 0 || P.credits < cost) return;
  P.credits -= cost;
  P.fuel = s.fuelMax;
  SND.buy();
  log(`Refueled for ${fmt(cost)} cr.`);
}

async function install() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) {}
    deferredPrompt = null;
    return;
  }
  log('Use your browser menu: Install app / Add to Home screen.');
}

$('pbody').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'sell') sell(b.dataset.k);
  else if (a === 'buy') buy(b.dataset.k);
  else if (a === 'mfg') manufacture(b.dataset.k);
  else if (a === 'repair') repair();
  else if (a === 'refuel') refuel();
  else if (a === 'undock') { closePanel(); return; }
  else if (a === 'clearroute') { R.route = null; log('Route cleared.'); openMap(); return; }
  else if (a === 'install') { install(); return; }
  else if (a === 'checkupd') { checkUpdates(true); return; }
  else if (a === 'setchan') { setChannel(b.dataset.k); return; }
  else if (a === 'applyupd') { applyUpdate(); return; }
  else if (a === 'reset') {
    if (confirm('Erase all Hollow Reach progress?')) { localStorage.removeItem(SAVE_KEY); location.reload(); }
    return;
  }
  save();
  refreshStation();
});

$('pclose').addEventListener('click', closePanel);

// ============ map ============
let mapPos = [];
function openMap() {
  openPanel('map', 'Galaxy Map',
    `<canvas id="mapc"></canvas>
     <div id="mapinfo" class="dim"></div>
     <div class="row"><button data-act="clearroute">Clear route</button><button data-act="closemap">Close</button></div>`);
  const cv = $('mapc');
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = -1, bd = 26;
    mapPos.forEach((p, i) => {
      const d = Math.hypot(p[0] - mx, p[1] - my);
      if (d < bd) { bd = d; best = i; }
    });
    if (best < 0) return;
    if (best === P.sysId) { R.route = null; log('Route cleared.'); closePanel(); return; }
    R.route = best;
    R.target = null; R.dest = null;
    const p = path(P.sysId, best);
    log(`Route plotted: ${p ? p.length - 1 : '?'} jump(s) to ${SYS[best].name}.`);
    closePanel();
  });
  drawMap();
}

function drawMap() {
  const cv = $('mapc');
  if (!cv) return;
  const r = cv.getBoundingClientRect();
  cv.width = r.width * DPR; cv.height = r.height * DPR;
  const g = cv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#070c16'; g.fillRect(0, 0, r.width, r.height);

  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const s of SYS) {
    minx = Math.min(minx, s.mx); maxx = Math.max(maxx, s.mx);
    miny = Math.min(miny, s.my); maxy = Math.max(maxy, s.my);
  }
  const pad = 36;
  const sc = Math.min((r.width - pad * 2) / (maxx - minx), (r.height - pad * 2) / (maxy - miny));
  mapPos = SYS.map(s => [pad + (s.mx - minx) * sc, pad + (s.my - miny) * sc]);

  const route = R.route != null ? path(P.sysId, R.route) : null;
  const onRoute = (a, b) => {
    if (!route) return false;
    for (let i = 1; i < route.length; i++) {
      const x = route[i - 1], y = route[i];
      if ((x === a && y === b) || (x === b && y === a)) return true;
    }
    return false;
  };

  g.lineWidth = 2;
  for (const s of SYS) for (const n of s.links) {
    if (n < s.id) continue;
    const [x1, y1] = mapPos[s.id], [x2, y2] = mapPos[n];
    g.strokeStyle = onRoute(s.id, n) ? '#ffd166' : '#22405f';
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }
  SYS.forEach(s => {
    const [x, y] = mapPos[s.id];
    const cur = s.id === P.sysId, tgt = s.id === R.route;
    g.fillStyle = secColor(s.sec);
    g.beginPath(); g.arc(x, y, cur ? 14 : 11, 0, TAU); g.fill();
    if (cur) { g.strokeStyle = '#ffffff'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 20, 0, TAU); g.stroke(); }
    if (tgt) { g.strokeStyle = '#ffd166'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 26, 0, TAU); g.stroke(); }
    g.textAlign = 'center';
    g.fillStyle = '#cfe8ff'; g.font = 'bold 12px system-ui';
    g.fillText(s.name, x, y - 24);
    g.fillStyle = '#7d97b5'; g.font = '11px system-ui';
    g.fillText('sec ' + s.sec.toFixed(1), x, y + 32);
  });

  const info = $('mapinfo');
  if (info) {
    info.textContent = route
      ? `Route: ${route.length - 1} jump(s) to ${SYS[R.route].name}. Autopilot warps through gates.`
      : 'Tap a system to plot an autopilot route. Your current system is ringed.';
  }
}

// ============ input ============
const ptr = new Map();
let joyId = null, tapId = null, tapMoved = false, pinchD0 = 1, pinchZ0 = 1;

function toWorld(x, y) {
  return { x: (x - W / 2) / ZOOM + cam.x, y: (y - H / 2) / ZOOM + cam.y };
}

function pick(p) {
  const tol = 34 / ZOOM;
  let best = null, bd = tol;
  const consider = (d, obj) => { if (d < bd) { bd = d; best = obj; } };
  const ds = Math.hypot(p.x, p.y);
  if (ds <= 70) consider(ds, { kind: 'station', ref: { x: 0, y: 0 } });
  for (const k in SYS[P.sysId].gates) {
    const pos = gatePos(Number(k));
    const d = dist(p, pos);
    if (d <= 70) consider(d, { kind: 'gate', to: Number(k), ref: pos });
  }
  for (const n of world.npcs) {
    const d = dist(p, n) - n.size;
    if (d <= 14) consider(d, { kind: 'npc', ref: n });
  }
  for (const a of world.asts) {
    const d = dist(p, a) - a.r;
    if (d <= 22) consider(d, { kind: 'ast', ref: a });
  }
  return best;
}

function doTap(x, y) {
  const p = toWorld(x, y);
  const hit = pick(p);
  R.route = null;
  R.mining = false;
  if (!hit) {
    R.target = null;
    R.dest = { x: p.x, y: p.y }; R.stop = 0;
    return;
  }
  R.target = hit;
  R.dest = hit.ref; R.stop = 0;
}

canvas.addEventListener('pointerdown', e => {
  if (R.panel) return;
  canvas.setPointerCapture(e.pointerId);
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
  const inJoyZone = e.clientX < W * 0.5 && e.clientY > H * 0.35;
  if (inJoyZone && joyId === null) {
    joyId = e.pointerId;
    joy.active = true;
    joy.bx = e.clientX; joy.by = e.clientY;
    joy.kx = e.clientX; joy.ky = e.clientY;
    joy.dx = 0; joy.dy = 0; joy.mag = 0;
    R.target = null; R.dest = null; R.route = null;
    tapId = null;
    return;
  }
  const nj = [...ptr.keys()].filter(id => id !== joyId);
  if (nj.length === 1) { tapId = e.pointerId; tapMoved = false; }
  if (nj.length === 2) {
    const [a, b] = nj.map(id => ptr.get(id));
    pinchD0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    pinchZ0 = U.zoom;
    tapMoved = true;
  }
});

canvas.addEventListener('pointermove', e => {
  const p = ptr.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (e.pointerId === joyId) {
    const dx = p.x - joy.bx, dy = p.y - joy.by;
    const d = Math.hypot(dx, dy) || 1;
    joy.mag = Math.min(1, d / 70);
    joy.dx = dx / d; joy.dy = dy / d;
    joy.kx = joy.bx + joy.dx * Math.min(d, 70);
    joy.ky = joy.by + joy.dy * Math.min(d, 70);
    return;
  }
  if (Math.hypot(p.x - p.sx, p.y - p.sy) > 14) tapMoved = true;
  const nj = [...ptr.keys()].filter(id => id !== joyId).map(id => ptr.get(id));
  if (nj.length === 2) {
    const d = Math.hypot(nj[0].x - nj[1].x, nj[0].y - nj[1].y);
    U.zoom = clamp(pinchZ0 * d / pinchD0, 0.6, 2.2);
  }
});

function endPtr(e) {
  if (!ptr.has(e.pointerId)) return;
  const p = ptr.get(e.pointerId);
  ptr.delete(e.pointerId);
  if (e.pointerId === joyId) {
    joyId = null; joy.active = false; joy.mag = 0;
    return;
  }
  if (e.pointerId === tapId && !tapMoved && !R.panel) doTap(p.x, p.y);
  if (e.pointerId === tapId) tapId = null;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);

// action buttons
$('bFire').addEventListener('click', () => {
  R.autoFire = !R.autoFire;

$('bMine').addEventListener('click', () => {

$('bWarp').addEventListener('click', () => {

  let best = null, bd = Infinity;

    const pos = gatePos(Number(k));
    const d = dist(ship, pos);
    if (d < bd) { bd = d; best = { to: Number(k), pos }; }

$('bLog').addEventListener('click', () => {

       <p class="tip">Play full screen from your home screen like a native app. ${canInstall ? 'Your browser can install it now.' : 'On Android Chrome: open the ⋮ menu and choose "Install app" or "Add to Home screen".'}</p>
       <button class="wide good" data-act="install">Install Hollow Reach</button>
     </div>
     <div class="sec"><h3>Controls</h3>
       <p class="tip">Drag in the lower-left to fly. Tap a rock to mine it, a pirate to attack it, the station to dock, or a ring to warp. FIRE and MINE work while you fly. MISSILE launches a homing warhead at the nearest pirate. DRONE deploys a combat or mining drone. Pinch to zoom.</p>
     </div>

     <button class="wide danger" data-act="reset">Reset universe</button>`);
});
$('bFire').addEventListener('pointerdown', e => e.stopPropagation());

// ============ docking bay drawing needs the station panel ============
// (drawDock is called from the loop when the station panel is open)

// ============ updates ============
const CHANNELS = ['stable', 'beta'];
const UPD = { latest: null, checkedAt: 0, checking: false, error: null, available: null };
function channel() { try { return localStorage.getItem('hollowReach.channel') || 'stable'; } catch (e) { return 'stable'; } }

function refreshUpdateBadge() {
  const ch = UPD.latest && UPD.latest.channels && UPD.latest.channels[channel()];
  UPD.available = ch && ch.build > APP.build ? ch : null;
  const b = $('bUpd');
  b.classList.toggle('upd', !!UPD.available);
  b.textContent = UPD.available ? 'Update' : 'Updates';
}

async function checkUpdates(manual) {
  if (UPD.checking) return;
  UPD.checking = true; UPD.error = null;
  renderUpdates();
  try {
    const res = await fetch(UPDATE_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || typeof data.channels !== 'object') throw new Error('bad manifest');
    UPD.latest = data;
    UPD.checkedAt = Date.now();
  } catch (e) {
    UPD.error = navigator.onLine === false ? 'Offline. Showing last known builds.' : 'Could not reach the update server.';
  }
  UPD.checking = false;
  const wasAvail = UPD.available;
  refreshUpdateBadge();
  renderUpdates();
  if (UPD.available && !wasAvail && !manual) log(`Update ${UPD.available.version} (build ${UPD.available.build}) is available.`);
}

function setChannel(k) {
  try { localStorage.setItem('hollowReach.channel', k); } catch (e) {}
  refreshUpdateBadge();
  renderUpdates();
}

async function applyUpdate() {
  const ch = UPD.available;
  if (!ch) return;
  if (ch.url) {
    const t = new URL(ch.url, location.href);
    if (t.origin !== location.origin) { location.href = t.href; return; }
  }
  log('Updating…');
  save();
  try {
    if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
    if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); }
  } catch (e) {}
  location.reload();
}

const notesHTML = list => `<ul class="notes">${(list || []).map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;

function channelCard(name, ch, isCur) {
  if (!ch) return `<div class="sec"><h3>${esc(name)}</h3><div class="dim">No builds published on this channel yet.</div></div>`;
  const newer = ch.build > APP.build;
  const hist = (ch.history || []).map(h =>
    `<details class="hist"><summary>v${esc(h.version)} · build ${h.build} · ${esc(h.date)}</summary>${notesHTML(h.notes)}</details>`).join('');
  return `<div class="sec">
    <div class="item">
      <div><h3 style="margin:0">${esc(name)}${isCur ? ' · yours' : ''}</h3>
        <div class="dim">Latest v${esc(ch.version)} · build ${ch.build} · ${esc(ch.date)}</div></div>
      <span class="tag ${newer ? 'new' : 'ok'}">${newer ? 'UPDATE' : 'CURRENT'}</span>
    </div>
    ${notesHTML(ch.notes)}
    ${hist ? `<div class="dim" style="margin:8px 0 2px">Earlier builds</div>${hist}` : ''}
  </div>`;
}

function renderUpdates() {
  if (R.panel !== 'updates') return;
  const cur = channel();
  const chs = (UPD.latest && UPD.latest.channels) || {};
  const status = UPD.checking ? 'Checking for updates…'
    : UPD.error ? esc(UPD.error)
    : UPD.checkedAt ? 'Last checked ' + new Date(UPD.checkedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : 'Not checked yet';
  $('pbody').innerHTML = `
    <div class="sec">
      <div class="item"><div><b>You're on v${esc(APP.version)}</b>
        <div class="dim">Build ${APP.build} · ${esc(cur)} channel · released ${esc(APP.date)}</div></div></div>
      <div class="dim">${status}</div>
      <div class="row" style="margin-top:10px">
        <button data-act="checkupd" ${UPD.checking ? 'disabled' : ''}>Check now</button>
        ${UPD.available ? `<button class="good" data-act="applyupd">Update to ${esc(UPD.available.version)}</button>` : ''}
      </div>
    </div>
    <div class="sec"><h3>Channel</h3>
      <div class="row">${CHANNELS.map(c => `<button data-act="setchan" data-k="${c}" class="${c === cur ? 'good' : ''}">${esc(c)}</button>`).join('')}</div>
      <div class="dim" style="margin-top:6px">Beta builds come first and may be less stable.</div>
    </div>
    ${CHANNELS.map(c => channelCard(c, chs[c], c === cur)).join('')}`;
}

$('bUpd').addEventListener('click', () => {
  openPanel('updates', 'Updates', '');
  renderUpdates();
  checkUpdates(true);
});
setTimeout(() => checkUpdates(false), 2500);
setInterval(() => checkUpdates(false), UPDATE_CHECK_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - UPD.checkedAt > UPDATE_CHECK_MS) checkUpdates(false);
});

// ============ PWA ============
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  log('Hollow Reach installed. Launch it from your home screen.');
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ============ loop ============
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (R.panel !== 'station' && R.panel !== 'map') step(dt);
  else R.time += dt;   // keep the docked ship animating while panels are open
  draw();
  if (R.panel === 'map') drawMap();
  if (R.panel === 'station') drawDock();
  requestAnimationFrame(loop);
}

populate();
ZOOM = BASEZ * U.zoom;
$('bSnd').textContent = SND.on ? 'Sound on' : 'Sound off';
log('Welcome to Hollow Reach. Drag to fly. Tap rocks, pirates, the station or rings.');
hud();
requestAnimationFrame(loop);
})();
</script>

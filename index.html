<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<meta name="description" content="Hollow Reach: a mobile space trading, mining and combat game." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hollow Reach" />
<title>Hollow Reach</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070d;color:#cfe8ff;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;display:block;touch-action:none}
#mini{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 8px);width:112px;height:112px;border-radius:50%;border:1px solid #1d3350;background:#05070dcc;pointer-events:none}
#hud{position:fixed;top:0;left:0;width:62%;max-width:420px;padding:calc(env(safe-area-inset-top) + 8px) 12px 16px;background:linear-gradient(#05070ded,#05070d00);pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#sysname{font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9ee6ff;text-shadow:0 0 8px #3ea6ff66}
#sec{margin-left:8px;font-weight:700}
#credits{color:#ffd166;font-variant-numeric:tabular-nums;font-weight:700;text-shadow:0 0 8px #ffd16655}
.bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.bar{height:9px;background:#0e1a2b;border:1px solid #1d3350;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .25s;box-shadow:0 0 8px currentColor}
#bsh{background:#3ea6ff;color:#3ea6ff}#bhu{background:#e0524c;color:#e0524c}#bfu{background:#7fd17f;color:#7fd17f}
.labels{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7d97b5;margin-top:2px}
#status{font-size:12px;color:#9fb6d0;margin-top:5px}
#cargo{font-size:12px;color:#9fb6d0;margin-top:5px;white-space:nowrap}
#menu{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 128px);display:flex;gap:6px}
.sm{min-width:56px;padding:8px 10px;font-size:12px;border-radius:8px}
#acts{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:grid;grid-template-columns:repeat(3,62px);gap:8px}
button{background:#0f2034e6;color:#cfe8ff;border:1px solid #2a4a6e;border-radius:12px;padding:10px 12px;font:700 13px system-ui;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button:disabled{opacity:.35}
.act{width:62px;height:62px;border-radius:50%;font-size:11px;letter-spacing:.05em;padding:0;line-height:1.1}
.act small{display:block;font-size:10px;color:#7d97b5;font-weight:600}
.act.on{background:#1d5a8f;border-color:#3ea6ff;box-shadow:0 0 14px #3ea6ff88}
.act.fire.on{background:#7a2a2a;border-color:#ff6b6b;box-shadow:0 0 14px #ff6b6b88}
.act.mine.on{background:#1b6b5f;border-color:#7fffd4;box-shadow:0 0 14px #7fffd488}
.act.stop{border-color:#5a4a2a;color:#ffd9a0}
.hide{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 218px);background:#0f2034ee;border:1px solid #2a4a6e;padding:7px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 4px 18px #000a}
#toast.show{opacity:1}
#flash{position:fixed;inset:0;background:#dff3ff;opacity:0;pointer-events:none;transition:opacity .4s}
#panel{position:fixed;inset:0;background:#05070ef7;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px)}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9ee6ff;margin-bottom:8px}
#pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sec{border-top:1px solid #1d3350;padding:8px 0}
h3{margin:6px 0;color:#9ee6ff;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;gap:8px}
.dim{color:#7d97b5;font-size:12px}
.wide{width:100%;margin-top:12px}
.danger{border-color:#6b2a2a;color:#ffb0a8}
.good{border-color:#2f6b3a;color:#b8f5c4}
.msg{padding:6px 0;border-bottom:1px solid #101c2e;font-size:13px}
#mapc{width:100%;height:50vh;display:block;touch-action:none;border:1px solid #1d3350;border-radius:12px;background:#070c16}
#mapinfo{margin:8px 0;font-size:13px}
.tip{font-size:13px;color:#b9cbe0;line-height:1.5;margin:6px 0}
.notes{margin:4px 0 6px;padding-left:18px;color:#b9cbe0;font-size:13px;line-height:1.5}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:6px;border:1px solid;white-space:nowrap}
.tag.new{color:#7fffd4;border-color:#7fffd4;background:#7fffd41a}
.tag.ok{color:#9fb6d0;border-color:#2a4a6e}
details.hist{margin:4px 0;border-top:1px solid #101c2e;padding:6px 0}
details.hist summary{cursor:pointer;color:#9ee6ff;font-size:13px}
#bUpd.upd{border-color:#7fffd4;color:#7fffd4;box-shadow:0 0 12px #7fffd488}
.dock-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-left:3px solid;padding:8px 10px;background:#0a1626;border-radius:10px;margin-bottom:8px}
.sname{font-weight:800;font-size:17px;color:#9ee6ff;letter-spacing:.04em}
.cr{text-align:right}
.cr b{display:block;font-size:20px;color:#ffd166;font-variant-numeric:tabular-nums;text-shadow:0 0 10px #ffd16655}
.dockc{width:100%;height:190px;display:block;border-radius:12px;border:1px solid #1d3350;margin-bottom:6px}
.meter{display:grid;grid-template-columns:52px 1fr 92px;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.meter span:last-child{text-align:right;color:#9fb6d0;font-variant-numeric:tabular-nums}
.mbar{height:8px;background:#0e1a2b;border:1px solid #1d3350;border-radius:5px;overflow:hidden}
.mbar i{display:block;height:100%;box-shadow:0 0 8px currentColor}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:8px}
.stat{display:flex;justify-content:space-between;font-size:12px;border-bottom:1px dotted #1d3350;padding:3px 0}
.stat b{font-variant-numeric:tabular-nums}
.ore{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #101c2e}
.ovalue{font-variant-numeric:tabular-nums;color:#ffd166;font-weight:700}
.up{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #101c2e}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:18px;height:6px;border-radius:3px;background:#14283f;border:1px solid #1d3350}
.pips i.on{background:#3ea6ff;border-color:#3ea6ff;box-shadow:0 0 6px #3ea6ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mini" width="256" height="256"></canvas>

<div id="hud">
  <div class="row"><div><span id="sysname"></span><span id="sec"></span></div><div id="credits"></div></div>
  <div class="bars">
    <div class="bar"><i id="bsh"></i></div>
    <div class="bar"><i id="bhu"></i></div>
    <div class="bar"><i id="bfu"></i></div>
  </div>
  <div class="labels"><span>Shield</span><span>Hull</span><span>Fuel</span></div>
  <div id="status"></div>
  <div id="cargo"></div>
</div>

<div id="menu">
  <button id="bMap" class="sm">Map</button>
  <button id="bSnd" class="sm">Sound on</button>
  <button id="bUpd" class="sm">Updates</button>
  <button id="bLog" class="sm">Log</button>
</div>

<div id="acts">
  <button id="bFire" class="act fire">FIRE</button>
  <button id="bMiss" class="act">MISSILE<small>0</small></button>
  <button id="bMine" class="act mine">MINE</button>
  <button id="bDrone" class="act">DRONE<small>0</small></button>
  <button id="bWarp" class="act">WARP</button>
  <button id="bDock" class="act">DOCK</button>
  <button id="bStop" class="act stop">STOP</button>
</div>

<div id="toast"></div>

<div id="panel" class="hide">
  <div class="ph"><span id="ptitle"></span><button id="pclose">Close</button></div>
  <div id="pbody"></div>
</div>

<div id="flash"></div>

<script>
(() => {
'use strict';

// ============ constants ============
const TAU = Math.PI * 2;
const GATE_R = 1500;
const JUMP_FUEL = 10;
const MINE_RANGE = 170;
const WEAPON_RANGE = 340;
const MISSILE_RANGE = 760;
const DOCK_RANGE = 110;
const TILE = 1024;
const SAVE_KEY = 'hollowReach.v2';
const SHIP_S = 1.8;          // ship draw scale
const DRONE_MAX = 4;
// bump version/build (and version.json) on every release
const APP = { version: '1.4.0', build: 5, date: '2026-10-21' };
const UPDATE_URL = 'version.json';
const UPDATE_CHECK_MS = 5 * 60 * 1000;

// ore types: rarer ores need more dangerous space
const ORE = {
  ferrum:    { name: 'Ferrum',    base: 10, hard: 1.00, crystal: false, sec: [0, 1],   w: 5,   col: ['#d9dde3', '#6f7785', '#2b303a'], vein: '200,210,225' },
  veldite:   { name: 'Veldite',   base: 14, hard: 1.00, crystal: false, sec: [0, 1],   w: 3,   col: ['#ead3a6', '#7d6848', '#241d12'], vein: '255,190,90' },
  azurite:   { name: 'Azurite',   base: 32, hard: 0.80, crystal: true,  sec: [0.4, 1], w: 1.2, col: ['#bfe3ff', '#2f6fb0', '#0c2440'], vein: '120,190,255' },
  krysite:   { name: 'Krysite',   base: 42, hard: 0.70, crystal: true,  sec: [0, 0.7], w: 1,   col: ['#c4fff7', '#2f9a90', '#0a2e2b'], vein: '120,255,240' },
  hollowite: { name: 'Hollowite', base: 80, hard: 0.55, crystal: true,  sec: [0, 0.3], w: 0.5, col: ['#f0c6ff', '#7a2fa6', '#1e0a2e'], vein: '230,140,255' },
};
const ORE_KEYS = Object.keys(ORE);

const UPG = [
  { k: 'cannon', name: 'Pulse Cannon',       base: 600, desc: '+8 damage per level' },
  { k: 'mining', name: 'Mining Laser',       base: 500, desc: '+0.8 ore/s per level' },
  { k: 'shield', name: 'Shield Booster',     base: 500, desc: '+30 max shield per level' },
  { k: 'armor',  name: 'Armor Plating',      base: 500, desc: '+40 max hull per level' },
  { k: 'cargo',  name: 'Cargo Hold',         base: 400, desc: '+25 cargo per level' },
  { k: 'engine', name: 'Afterburner Engine', base: 400, desc: '+30 top speed per level' },
  { k: 'fuel',   name: 'Fuel Tank',          base: 300, desc: '+40 max fuel per level' },
];

// manufacturing: ore from your hold + credits -> items
const RECIPES = [
  { k: 'missile', name: 'Missile x3',   need: { ferrum: 4, azurite: 1 }, cost: 150, out: { missile: 3 },  desc: 'Homing warhead. Launch with the MISSILE button.' },
  { k: 'mdrone',  name: 'Mining drone', need: { ferrum: 2, veldite: 6 }, cost: 200, out: { mdrone: 1 },   desc: 'Mines nearby rocks into your hold at half your rate.' },
  { k: 'cdrone',  name: 'Combat drone', need: { ferrum: 4, krysite: 3 }, cost: 260, out: { cdrone: 1 },   desc: 'Hunts pirates near your ship with a pulse laser.' },
];
const ITEM_NAMES = { missile: 'Missiles', mdrone: 'Mining drones', cdrone: 'Combat drones' };

// enemy classes. hull points are in unscaled local units (nose +x)
const CLS = {
  scout: {
    sc: 1.0, size: 15, hp: 60, len: 12, cockpit: 6,
    hull: [[12, 0], [4, -5], [-6, -6], [-9, 0], [-6, 6], [4, 5]],
    seams: [[-2, -5, -2, 5], [4, -3, -4, -4], [4, 3, -4, 4]],
    engines: [[-9, -3], [-9, 3]],
    turrets: [[2, 0]]
  },
  raider: {
    sc: 1.25, size: 20, hp: 110, len: 18, cockpit: 10,
    hull: [[18, 0], [8, -6], [-4, -10], [-12, -8], [-14, 0], [-12, 8], [-4, 10], [8, 6]],
    seams: [[2, -9, -4, -6], [2, 9, -4, 6], [-6, -6, -6, 6]],
    engines: [[-14, -4], [-14, 4]],
    turrets: [[3, -7], [3, 7], [-6, 0]]
  },
  cruiser: {
    sc: 1.5, size: 30, hp: 190, len: 24, cockpit: 16,
    hull: [[26, 0], [16, -6], [4, -12], [-12, -14], [-22, -9], [-24, 0], [-22, 9], [-12, 14], [4, 12], [16, 6]],
    seams: [[14, -10, -4, -10], [14, 10, -4, 10], [-6, -13, -6, 13]],
    engines: [[-24, -5], [-24, 5]],
    turrets: [[10, -9], [10, 9], [-8, -10]]
  },
};

const NAMES = ['Ketra','Oryn','Vesk','Halden','Murro','Tessaly','Brimm','Caldis','Ixar','Pell','Sorrow','Vantris'];

// ============ helpers ============
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.floor(n).toLocaleString();
const pct = (v, m) => clamp((v / m) * 100, 0, 100) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const secColor = s => s >= 0.7 ? '#3ea6ff' : s >= 0.4 ? '#ffb347' : '#e0524c';
function vibe(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function nearestTo(list, x, y, range) {
  let best = null, bd = range;
  for (const o of list) { const d = Math.hypot(o.x - x, o.y - y); if (d <= bd) { bd = d; best = o; } }
  return best;
}

// ============ galaxy (3 rows x 4 cols) ============
const SYS = (() => {
  const r = rng(7);
  const out = [];
  const PLANET_KINDS = [
    { c1: '#f2b880', c2: '#8a4b2a', bands: 6, ring: true,  ringCol: '#e8d6a8' },
    { c1: '#9aa6b8', c2: '#3a4456', bands: 0, ring: false, ringCol: '' },
    { c1: '#d6f1ff', c2: '#4f7fa6', bands: 3, ring: true,  ringCol: '#bfe6ff' },
  ];
  for (let i = 0; i < 12; i++) {
    const col = i % 4, row = Math.floor(i / 4);
    const sec = row === 0 ? +(0.8 + r() * 0.2).toFixed(1)
              : row === 1 ? +(0.4 + r() * 0.2).toFixed(1)
              : +(0.1 + r() * 0.25).toFixed(1);
    const kind = PLANET_KINDS[Math.floor(r() * 3)];
    const pa = r() * TAU;
    out.push({
      id: i, name: NAMES[i], sec, col, row,
      mx: col * 200 + 100 + (r() * 30 - 15),
      my: row * 190 + 100 + (r() * 30 - 15),
      hue: sec >= 0.7 ? 210 : sec >= 0.4 ? 30 : 350,
      planet: { x: Math.cos(pa) * 1050, y: Math.sin(pa) * 1050, r: 180 + r() * 140, ...kind },
      links: [], gates: {}
    });
  }
  out.forEach(s => {
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => {
      const c = s.col + dc, rr = s.row + dr;
      if (c >= 0 && c < 4 && rr >= 0 && rr < 3) s.links.push(rr * 4 + c);
    });
  });
  out.forEach(s => s.links.forEach(n => {
    const o = out[n];
    s.gates[n] = Math.atan2(o.my - s.my, o.mx - s.mx);
  }));
  return out;
})();

function path(from, to) {
  const prev = { [from]: null };
  const q = [from];
  while (q.length) {
    const c = q.shift();
    if (c === to) break;
    for (const n of SYS[c].links) if (!(n in prev)) { prev[n] = c; q.push(n); }
  }
  if (!(to in prev)) return null;
  const p = [];
  let c = to;
  while (c !== null) { p.unshift(c); c = prev[c]; }
  return p;
}

// ============ persistent state ============
const freshCargo = () => { const c = {}; ORE_KEYS.forEach(k => c[k] = 0); return c; };
function freshState() {
  return {
    v: 1, credits: 1000,
    levels: { cannon: 0, mining: 0, shield: 0, armor: 0, cargo: 0, engine: 0, fuel: 0 },
    hull: 100, shield: 60, fuel: 100,
    cargo: freshCargo(),
    items: { missile: 0, mdrone: 0, cdrone: 0 },
    sysId: 0, kills: 0, deaths: 0, mined: 0
  };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d && d.v === 1 && d.s) {
      const f = freshState();
      const s = Object.assign(f, d.s);
      s.levels = Object.assign(f.levels, d.s.levels || {});
      s.cargo = Object.assign(f.cargo, d.s.cargo || {});
      s.items = Object.assign(f.items, d.s.items || {});
      if (!SYS[s.sysId]) s.sysId = 0;
      return s;
    }
  } catch (e) {}
  return freshState();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, s: P })); } catch (e) {} }
const P = load();

// ============ runtime state ============
const R = {
  target: null, dest: null, stop: 0, route: null,
  mining: false, mineRef: null, mineAcc: 0, chipT: 0, fullWarn: false,
  fireCool: 0, missCool: 0, shieldDelay: 0, hitFlash: 0, shake: 0,
  side: 1, msSide: 1,
  autoFire: false, autoMine: false,
  panel: null, saveT: 0, hudT: 0, msgs: [], time: 0
};
const U = { zoom: 1 };
const joy = { active: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, mag: 0 };
const ship = { x: 130, y: 0, vx: 0, vy: 0, heading: 0 };
const cam = { x: 130, y: 0 };
const TUR = { a: 0 };           // mining turret aim (world radians)
const WT = { a: 0, recoil: 0 }; // weapon turrets aim (world radians)
const world = { asts: [], npcs: [], beams: [], rings: [], parts: [], texts: [], missiles: [], drones: [], tAst: 0, tPir: 0, timerA: 0, timerP: 0 };
let deferredPrompt = null;

const starLayers = [
  { f: 0.05, s: [0.6, 1.1], n: 140 },
  { f: 0.14, s: [1.0, 1.7], n: 90 },
  { f: 0.30, s: [1.4, 2.3], n: 40 },
].map(L => ({
  ...L,
  pts: Array.from({ length: L.n }, () => ({
    x: Math.random() * TILE, y: Math.random() * TILE,
    s: rnd(L.s[0], L.s[1]), a: rnd(0.35, 1), tw: rnd(0.6, 2.2), p: rnd(0, TAU)
  }))
}));

// ============ stats ============
function st() {
  const L = P.levels;
  return {
    dmg: 18 + 8 * L.cannon,
    rate: 2.5 + 0.8 * L.mining,
    shMax: 60 + 30 * L.shield,
    hullMax: 100 + 40 * L.armor,
    cargoMax: 50 + 25 * L.cargo,
    speed: 220 + 30 * L.engine,
    fuelMax: 100 + 40 * L.fuel,
    cool: 0.7
  };
}
const cargoUsed = () => ORE_KEYS.reduce((a, k) => a + (P.cargo[k] || 0), 0);
const secOf = () => SYS[P.sysId].sec;
const unitPrice = k => Math.round(ORE[k].base * (1 + (1 - secOf()) * 0.6));
const canMake = r => P.credits >= r.cost && Object.keys(r.need).every(k => P.cargo[k] >= r.need[k]);

// ============ canvas ============
const canvas = $('c');
const mainCtx = canvas.getContext('2d');
let ctx = mainCtx;   // swapped briefly when drawing the ship into the docking bay
const mini = $('mini');
const mctx = mini.getContext('2d');
let W = 0, H = 0, DPR = 1, BASEZ = 1, ZOOM = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  BASEZ = clamp(Math.min(W, H) / 420, 0.7, 1.4);
}
addEventListener('resize', resize);
resize();

// ============ nebula (cached per system) ============
const nebCache = {};
function nebula(sysId) {
  if (nebCache[sysId]) return nebCache[sysId];
  const N = 512;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  const r = rng(sysId * 977 + 13);
  const hue = SYS[sysId].hue;
  for (let i = 0; i < 10; i++) {
    const x = r() * N, y = r() * N, rad = 110 + r() * 170;
    const col = `hsla(${hue + r() * 50 - 25},75%,${45 + r() * 20}%,`;
    for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) {
      const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, rad);
      gr.addColorStop(0, col + '0.22)');
      gr.addColorStop(1, col + '0)');
      g.fillStyle = gr;
      g.fillRect(x + dx - rad, y + dy - rad, rad * 2, rad * 2);
    }
  }
  nebCache[sysId] = c;
  return c;
}

// ============ sound (synthesized with Web Audio; no audio files) ============
const SND = {
  on: (() => { try { return localStorage.getItem('hollowReach.sound') !== 'off'; } catch (e) { return true; } })(),
  ac: null, master: null, noise: null, eng: null, engG: null, engF: null, mineNodes: null, mineOn: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = new AC();
      this.ac = ac;
      this.master = ac.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(ac.destination);
      const len = (ac.sampleRate * 1.5) | 0;
      this.noise = ac.createBuffer(1, len, ac.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 55;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
      const g = ac.createGain(); g.gain.value = 0;
      o.connect(f); f.connect(g); g.connect(this.master); o.start();
      this.eng = o; this.engG = g; this.engF = f;
    } catch (e) { this.ac = null; }
  },
  ok() { return this.on && this.ac && this.ac.state === 'running'; },
  tone(freq, dur, o = {}) {
    if (!this.ok()) return;
    const type = o.type || 'square', vol = o.vol ?? 0.2, slide = o.slide ?? null, delay = o.delay || 0;
    const t = this.ac.currentTime + delay;
    const osc = this.ac.createOscillator(), g = this.ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  noiseBurst(dur, o = {}) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + (o.delay || 0);
    const src = this.ac.createBufferSource(); src.buffer = this.noise;
    const f = this.ac.createBiquadFilter();
    f.type = o.type || 'lowpass'; f.frequency.value = o.freq || 800; f.Q.value = o.q || 1;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(o.vol ?? 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, rnd(0, 0.5)); src.stop(t + dur + 0.02);
  },
  laser()     { this.tone(880, 0.12, { type: 'square', vol: 0.1, slide: 220 }); },
  enemyShot() { this.tone(420, 0.12, { type: 'square', vol: 0.06, slide: 160 }); },
  hit()       { this.noiseBurst(0.18, { freq: 500, vol: 0.35 }); this.tone(110, 0.2, { type: 'sine', vol: 0.25, slide: 50 }); },
  playerHit() { this.noiseBurst(0.2, { freq: 300, vol: 0.45 }); this.tone(90, 0.25, { type: 'sine', vol: 0.3, slide: 40 }); },
  explode()   { this.noiseBurst(0.7, { freq: 900, vol: 0.45 }); this.tone(140, 0.5, { type: 'sine', vol: 0.3, slide: 30 }); },
  boom()      { this.noiseBurst(0.9, { freq: 600, vol: 0.55 }); this.tone(90, 0.6, { type: 'sine', vol: 0.4, slide: 25 }); this.noiseBurst(0.3, { freq: 3000, type: 'highpass', vol: 0.15, delay: 0.02 }); },
  death()     { this.noiseBurst(1.4, { freq: 400, vol: 0.55 }); this.tone(400, 1.2, { type: 'sawtooth', vol: 0.18, slide: 40 }); },
  // mining: a bright zap per chip, plus a looping humming beam while the laser is on
  mine()      { this.tone(2400, 0.07, { type: 'sine', vol: 0.05, slide: 1100 }); this.noiseBurst(0.04, { freq: 4000, type: 'highpass', vol: 0.05 }); },
  mineSet(on) {
    if (on === this.mineOn || !this.ok()) return;
    this.mineOn = on;
    const ac = this.ac, t = ac.currentTime;
    if (on) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 180;
      const lfo = ac.createOscillator(); lfo.frequency.value = 9;
      const lg = ac.createGain(); lg.gain.value = 40;
      lfo.connect(lg); lg.connect(o.frequency);
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 3;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.15);
      o.connect(f); f.connect(g); g.connect(this.master);
      o.start(); lfo.start();
      this.mineNodes = { o, lfo, g };
    } else if (this.mineNodes) {
      const { o, lfo, g } = this.mineNodes;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.stop(t + 0.15); lfo.stop(t + 0.15);
      this.mineNodes = null;
    }
  },
  chime()     { [660, 880, 1320].forEach((f, i) => this.tone(f, 0.25, { type: 'triangle', vol: 0.16, delay: i * 0.07 })); },
  coin()      { this.tone(988, 0.1, { type: 'square', vol: 0.08 }); this.tone(1319, 0.18, { type: 'square', vol: 0.08, delay: 0.08 }); },
  buy()       { [523, 659, 784].forEach((f, i) => this.tone(f, 0.18, { type: 'triangle', vol: 0.16, delay: i * 0.08 })); },
  mfg()       { this.noiseBurst(0.05, { freq: 2500, type: 'bandpass', vol: 0.25, q: 4 }); this.tone(320, 0.08, { type: 'square', vol: 0.1 }); this.noiseBurst(0.05, { freq: 2500, type: 'bandpass', vol: 0.25, q: 4, delay: 0.18 }); this.tone(260, 0.08, { type: 'square', vol: 0.1, delay: 0.18 }); },
  missile()   { this.noiseBurst(0.5, { freq: 1200, type: 'bandpass', vol: 0.18, q: 1.5 }); this.tone(300, 0.35, { type: 'sawtooth', vol: 0.06, slide: 900 }); },
  drone()     { this.tone(600, 0.12, { type: 'triangle', vol: 0.12, slide: 1400 }); this.tone(1400, 0.1, { type: 'triangle', vol: 0.08, delay: 0.1 }); },
  dock()      { this.tone(440, 0.2, { type: 'sine', vol: 0.18 }); this.tone(660, 0.3, { type: 'sine', vol: 0.18, delay: 0.15 }); },
  warp()      { this.tone(120, 1.0, { type: 'sawtooth', vol: 0.1, slide: 1400 }); this.noiseBurst(0.9, { freq: 2000, type: 'bandpass', vol: 0.15, q: 2 }); },
  error()     { this.tone(150, 0.25, { type: 'sawtooth', vol: 0.12, slide: 110 }); },
  click()     { this.tone(1800, 0.03, { type: 'square', vol: 0.05 }); },
  engine(frac) {
    if (!this.ok() || !this.eng) return;
    const t = this.ac.currentTime;
    this.engG.gain.setTargetAtTime(0.02 + 0.06 * frac, t, 0.1);
    this.engF.frequency.setTargetAtTime(200 + 500 * frac, t, 0.1);
    this.eng.frequency.setTargetAtTime(45 + 40 * frac, t, 0.1);
  },
  setOn(v) {
    this.on = v;
    try { localStorage.setItem('hollowReach.sound', v ? 'on' : 'off'); } catch (e) {}
    if (!v && this.engG) this.engG.gain.value = 0;
    if (!v) this.mineSet(false);
  }
};
// audio contexts can only start after a user gesture
document.addEventListener('pointerdown', () => SND.init(), true);

// ============ feedback ============
let toastT = 0;
function log(m) {
  R.msgs.unshift({ t: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), m });
  R.msgs.length = Math.min(R.msgs.length, 100);
  const t = $('toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
function flash() {
  const f = $('flash');
  f.style.opacity = 0.45;
  setTimeout(() => { f.style.opacity = 0; }, 90);
}
function text(x, y, txt, col) { world.texts.push({ x, y, txt, col, life: 0.9, max: 0.9 }); }

// ============ particles ============
function part(x, y, vx, vy, life, col, size) {
  if (world.parts.length > 700) return;
  world.parts.push({ x, y, vx, vy, life, max: life, col, size });
}
function burst(x, y, col, n, speed, life) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(speed * 0.3, speed);
    part(x, y, Math.cos(a) * s, Math.sin(a) * s, life * rnd(0.6, 1), col, rnd(1.5, 3.5));
  }
}
function updateParts(dt) {
  const k = Math.pow(0.35, dt);
  for (const p of world.parts) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= k; p.vy *= k;
    p.life -= dt;
  }
  let w = 0;
  for (let i = 0; i < world.parts.length; i++) if (world.parts[i].life > 0) world.parts[w++] = world.parts[i];
  world.parts.length = w;
}

// ============ spawning ============
function pickOre(sec) {
  const els = ORE_KEYS.filter(k => sec >= ORE[k].sec[0] && sec <= ORE[k].sec[1]);
  const tot = els.reduce((a, k) => a + ORE[k].w, 0);
  let r = Math.random() * tot;
  for (const k of els) { r -= ORE[k].w; if (r <= 0) return k; }
  return els[0];
}
function spawnAst() {
  const a = rnd(0, TAU), d = rnd(300, 1250);
  const ot = pickOre(secOf());
  const crys = ORE[ot].crystal;
  const r = crys ? 16 : rnd(20, 30);
  const pts = [];
  for (let i = 0; i < 9; i++) {
    const t = i / 9 * TAU;
    const rr = r * rnd(0.78, 1.12);
    pts.push([Math.cos(t) * rr, Math.sin(t) * rr]);
  }
  const max = crys ? 60 : 140;
  world.asts.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r, ot, ore: max, max, pts, rot: rnd(0, TAU) });
}
function spawnPir() {
  const sec = secOf();
  const keys = Object.keys(SYS[P.sysId].gates);
  const g = SYS[P.sysId].gates[keys[(Math.random() * keys.length) | 0]];
  const a = g + rnd(-0.3, 0.3), d = rnd(1150, 1350);
  const tier = sec < 0.2 ? 3 : sec < 0.4 ? 2 : 1;
  const cls = ['scout', 'raider', 'cruiser'][tier - 1];
  const C = CLS[cls];
  world.npcs.push({
    x: Math.cos(a) * d, y: Math.sin(a) * d, vx: 0, vy: 0,
    cls, tier, hp: C.hp, max: C.hp, size: C.size,
    hd: 0, aggro: false, dead: false,
    turrets: C.turrets.map(([x, y]) => ({ x, y, a: 0, cool: rnd(0.2, 1.2), flash: 0 }))
  });
}
function populate() {
  const sec = secOf();
  world.asts = []; world.npcs = []; world.beams = []; world.rings = []; world.parts = []; world.texts = [];
  world.missiles = []; world.drones = [];
  world.tAst = sec >= 0.7 ? 8 : sec >= 0.4 ? 11 : 14;
  world.tPir = sec >= 0.7 ? 0 : sec >= 0.4 ? 2 : 5;
  for (let i = 0; i < world.tAst; i++) spawnAst();
  for (let i = 0; i < world.tPir; i++) spawnPir();
  world.timerA = 0; world.timerP = 0;
}
function updateSpawns(dt) {
  world.timerA += dt;
  if (world.timerA > 12 && world.asts.length < world.tAst) { world.timerA = 0; spawnAst(); }
  world.timerP += dt;
  if (world.timerP > 25 && world.npcs.length < world.tPir) { world.timerP = 0; spawnPir(); }
}

// ============ combat ============
function beam(x1, y1, x2, y2, col, life) { world.beams.push({ x1, y1, x2, y2, col, life, max: life }); }
const nearestNpc = r => nearestTo(world.npcs, ship.x, ship.y, r);
const nearestAst = r => nearestTo(world.asts, ship.x, ship.y, r);

// world position of a weapon turret muzzle on wing k (-1 port, 1 starboard)
function weaponMuzzle(k) {
  const b = shipPoint(1, -11 * k);
  return { x: b.x + Math.cos(WT.a) * 9 * SHIP_S, y: b.y + Math.sin(WT.a) * 9 * SHIP_S };
}

function hitNpc(n, dmg) {
  if (n.dead) return;
  n.hp -= dmg;
  text(n.x, n.y - 40, '-' + Math.round(dmg), '#9ee6ff');
  burst(n.x, n.y, '#ffd0a0', 4, 70, 0.3);
  if (n.hp <= 0) killNpc(n);
}

function fireAt(n) {
  const s = st();
  R.fireCool = s.cool;
  SND.laser();
  const k = R.side || 1; R.side = -k;
  WT.recoil = 0.12;
  const m = weaponMuzzle(k);
  beam(m.x, m.y, n.x, n.y, '#9ee6ff', 0.2);
  hitNpc(n, s.dmg * rnd(0.9, 1.1));
}

function killNpc(n) {
  if (n.dead) return;
  n.dead = true;
  world.npcs = world.npcs.filter(x => x !== n);
  const bounty = Math.round(150 * n.tier * (1 + (1 - secOf()) * 0.5));
  P.credits += bounty; P.kills++;
  burst(n.x, n.y, '#ff9e6b', 26, 240, 0.9);
  burst(n.x, n.y, '#fff2d0', 10, 140, 0.6);
  world.rings.push({ x: n.x, y: n.y, life: 0.6, max: 0.6, r: 60 });
  text(n.x, n.y - 40, '+' + fmt(bounty) + ' cr', '#ffd166');
  if (R.target && R.target.ref === n) R.target = null;
  SND.explode(); SND.coin();
  vibe([30, 40, 30]);
  log(`Pirate destroyed. Bounty ${fmt(bounty)} cr.`);
}

function removeAst(a) { world.asts = world.asts.filter(x => x !== a); }

function mine(a, dt) {
  const s = st();
  if (cargoUsed() >= s.cargoMax) {
    R.mining = false;
    if (R.target && R.target.kind === 'ast') R.target = null;
    if (!R.fullWarn) { R.fullWarn = true; SND.error(); log('Cargo hold full. Sell ore at a station.'); }
    return;
  }
  R.mining = true;
  R.mineRef = a;
  R.mineAcc += s.rate * ORE[a.ot].hard * dt;
  while (R.mineAcc >= 1 && a.ore > 0 && cargoUsed() < s.cargoMax) {
    R.mineAcc -= 1; a.ore -= 1;
    P.cargo[a.ot]++;
    P.mined++;
  }
  R.chipT += dt;
  if (R.chipT > 0.12) {
    R.chipT = 0;
    const dx = ship.x - a.x, dy = ship.y - a.y, d = Math.hypot(dx, dy) || 1;
    SND.mine();
    part(a.x + rnd(-a.r, a.r) * 0.5, a.y + rnd(-a.r, a.r) * 0.5, dx / d * 140, dy / d * 140, 0.5, `rgb(${ORE[a.ot].vein})`, 2.2);
  }
  if (a.ore <= 0) {
    removeAst(a);
    burst(a.x, a.y, `rgb(${ORE[a.ot].vein})`, 14, 160, 0.6);
    R.mining = false;
    if (R.target && R.target.kind === 'ast') R.target = null;
    SND.chime();
    log(`${ORE[a.ot].name} rock depleted.`);
  }
}

function hitPlayer(dmg) {
  R.shieldDelay = 5;
  R.hitFlash = 0.25;
  R.shake = Math.min(14, R.shake + dmg * 0.5);
  text(ship.x, ship.y - 28, '-' + Math.round(dmg), '#ff6b6b');
  vibe(18);
  SND.playerHit();
  const a = Math.min(P.shield, dmg);
  P.shield -= a; dmg -= a;
  if (dmg > 0) P.hull -= dmg;
  if (P.hull <= 0) { die(); return true; }
  return false;
}

function damageDrone(d, dmg) {
  d.hp -= dmg;
  burst(d.x, d.y, '#ffb347', 6, 90, 0.3);
  if (d.hp <= 0) {
    burst(d.x, d.y, '#ff9e6b', 16, 160, 0.6);
    log(`${d.type === 'com' ? 'Combat' : 'Mining'} drone lost.`);
  }
}

function die() {
  P.deaths++;
  const lost = Math.floor(P.credits * 0.1);
  P.credits -= lost;
  P.cargo = freshCargo();
  const s = st();
  P.hull = s.hullMax; P.shield = s.shMax; P.fuel = Math.max(P.fuel, 30);
  burst(ship.x, ship.y, '#9ee6ff', 40, 260, 1.1);
  burst(ship.x, ship.y, '#ff9e6b', 30, 200, 0.9);
  ship.x = 130; ship.y = 0; ship.vx = 0; ship.vy = 0;
  cam.x = ship.x; cam.y = ship.y;
  R.target = null; R.dest = null; R.route = null; R.mining = false; R.autoFire = false; R.autoMine = false;
  populate();
  SND.mineSet(false);
  flash();
  SND.death();
  vibe([80, 60, 120]);
  log(`Ship destroyed. Clone cost ${fmt(lost)} cr. Cargo and drones lost.`);
  save();
}

// ---- missiles: homing warheads fired from the wing racks ----
function launchMissile() {
  if (R.missCool > 0) return;
  if (P.items.missile <= 0) { SND.error(); log('No missiles. Manufacture more at a station.'); return; }
  let tgt = R.target && R.target.kind === 'npc' && world.npcs.includes(R.target.ref) ? R.target.ref : null;
  if (!tgt || dist(ship, tgt) > MISSILE_RANGE) tgt = nearestNpc(MISSILE_RANGE);
  if (!tgt) { SND.error(); log('No pirate in missile range.'); return; }
  P.items.missile--;
  R.missCool = 1.0;
  const side = R.msSide || 1; R.msSide = -side;
  const p = shipPoint(-10, 11.5 * side);
  const a = Math.atan2(tgt.y - p.y, tgt.x - p.x);
  world.missiles.push({ x: p.x, y: p.y, a, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, tgt, life: 5, ph: 0, dmg: 120 });
  burst(p.x, p.y, '#ffd9a0', 10, 120, 0.4);
  SND.missile(); vibe(12);
  log('Missile away.');
}

function explodeMissile(m, hit) {
  burst(m.x, m.y, '#ffb347', 28, 260, 0.8);
  burst(m.x, m.y, '#fff2d0', 12, 160, 0.5);
  world.rings.push({ x: m.x, y: m.y, life: 0.5, max: 0.5, r: 70 });
  SND.boom();
  if (hit) hitNpc(hit, m.dmg);
  for (const n of [...world.npcs]) if (n !== hit && dist(n, m) < 50) hitNpc(n, m.dmg * 0.4);
}

function updateMissiles(dt) {
  for (const m of world.missiles) {
    m.life -= dt; m.ph += dt;
    if (!m.tgt || !world.npcs.includes(m.tgt)) m.tgt = nearestTo(world.npcs, m.x, m.y, 900) || null;
    const sp = Math.min(440, 140 + m.ph * 380);
    const cur = Math.atan2(m.vy, m.vx);
    const desired = m.tgt ? Math.atan2(m.tgt.y - m.y, m.tgt.x - m.x) : cur;
    const d = Math.atan2(Math.sin(desired - cur), Math.cos(desired - cur));
    const nd = cur + clamp(d, -4.2 * dt, 4.2 * dt);
    m.vx = Math.cos(nd) * sp; m.vy = Math.sin(nd) * sp; m.a = nd;
    m.x += m.vx * dt; m.y += m.vy * dt;
    part(m.x - Math.cos(nd) * 8, m.y - Math.sin(nd) * 8, rnd(-20, 20), rnd(-20, 20), 0.5, Math.random() < 0.5 ? '#ffb347' : '#dfe8f5', 2.6);
    let hit = null;
    if (m.tgt && dist(m, m.tgt) < m.tgt.size + 8) hit = m.tgt;
    else for (const n of world.npcs) if (dist(m, n) < n.size + 6) { hit = n; break; }
    if (hit || m.life <= 0) { explodeMissile(m, hit); m.dead = true; }
  }
  world.missiles = world.missiles.filter(m => !m.dead);
}

// ---- drones: deployed from the ship, fight or mine on their own ----
function deployDrone() {
  if (world.drones.length >= DRONE_MAX) { log('Drone limit reached.'); return; }
  const type = P.items.cdrone > 0 ? 'com' : P.items.mdrone > 0 ? 'min' : null;
  if (!type) { SND.error(); log('No drones. Manufacture some at a station.'); return; }
  if (type === 'com') P.items.cdrone--; else P.items.mdrone--;
  const p = shipPoint(0, 0);
  world.drones.push({ type, x: p.x, y: p.y, vx: 0, vy: 0, hp: 45, life: 150, ang: rnd(0, TAU), rot: 0, cool: 0, tgt: null, acc: 0, mining: false });
  burst(p.x, p.y, type === 'com' ? '#ffb347' : '#7fffd4', 14, 120, 0.5);
  SND.drone();
  log(type === 'com' ? 'Combat drone launched.' : 'Mining drone launched.');
}

function recallDrones() {
  for (const d of world.drones) P.items[d.type === 'com' ? 'cdrone' : 'mdrone']++;
  if (world.drones.length) log(`${world.drones.length} drone(s) recalled to your hold.`);
  world.drones = [];
}

function steer(d, gx, gy, maxSp, dt) {
  const dx = gx - d.x, dy = gy - d.y, dd = Math.hypot(dx, dy) || 1;
  const want = Math.min(maxSp, dd * 2.2);
  const k = Math.min(1, dt * 3);
  d.vx += (dx / dd * want - d.vx) * k;
  d.vy += (dy / dd * want - d.vy) * k;
  d.x += d.vx * dt; d.y += d.vy * dt;
}

function updateDrones(dt) {
  const s = st();
  for (const d of world.drones) {
    d.life -= dt; d.rot += dt * 18; d.cool -= dt; d.ang += dt * 0.9;
    d.mining = false;
    if (d.type === 'com') {
      if (!d.tgt || d.tgt.dead || !world.npcs.includes(d.tgt) || dist(d, d.tgt) > 700) d.tgt = nearestTo(world.npcs, d.x, d.y, 520) || null;
      const t = d.tgt;
      if (t) {
        const a = Math.atan2(d.y - t.y, d.x - t.x);
        steer(d, t.x + Math.cos(a) * 170, t.y + Math.sin(a) * 170, 260, dt);
        if (dist(d, t) < 260 && d.cool <= 0) {
          d.cool = 0.55;
          beam(d.x, d.y, t.x, t.y, '#ffb347', 0.2);
          hitNpc(t, 10 + P.levels.cannon * 4);
        }
      } else {
        steer(d, ship.x + Math.cos(d.ang) * 90, ship.y + Math.sin(d.ang) * 90, 260, dt);
      }
    } else {
      let a = d.tgt;
      if (!a || !world.asts.includes(a)) a = d.tgt = nearestTo(world.asts, ship.x, ship.y, 520) || null;
      if (a && cargoUsed() < s.cargoMax) {
        const ang = Math.atan2(ship.y - a.y, ship.x - a.x);
        steer(d, a.x + Math.cos(ang) * (a.r + 40), a.y + Math.sin(ang) * (a.r + 40), 220, dt);
        if (dist(d, a) < a.r + 90) {
          d.mining = true;
          d.acc += s.rate * 0.5 * ORE[a.ot].hard * dt;
          while (d.acc >= 1 && a.ore > 0 && cargoUsed() < s.cargoMax) { d.acc -= 1; a.ore--; P.cargo[a.ot]++; P.mined++; }
          if (a.ore <= 0) { removeAst(a); d.tgt = null; burst(a.x, a.y, `rgb(${ORE[a.ot].vein})`, 10, 120, 0.5); }
        }
      } else {
        steer(d, ship.x + Math.cos(d.ang) * 90, ship.y + Math.sin(d.ang) * 90, 260, dt);
      }
    }
  }
  world.drones = world.drones.filter(d => {
    if (d.life <= 0) { P.items[d.type === 'com' ? 'cdrone' : 'mdrone']++; log('Drone returned to your hold.'); return false; }
    return d.hp > 0;
  });
}

// ---- enemy ships: turrets track the nearest target and fire when aligned ----
function enemyTarget(n) {
  let best = null, bd = 900;
  const dp = dist(n, ship);
  if (dp < bd) { best = ship; bd = dp; }
  for (const d of world.drones) { const dd = dist(n, d); if (dd < 300 && dd < bd) { best = d; bd = dd; } }
  return best;
}
function npcPoint(n, lx, ly) {
  const sc = CLS[n.cls].sc, c = Math.cos(n.hd), s = Math.sin(n.hd);
  return { x: n.x + (lx * c - ly * s) * sc, y: n.y + (lx * s + ly * c) * sc };
}

function stepNpcs(dt) {
  for (const n of [...world.npcs]) {
    if (n.dead) continue;
    const dx = ship.x - n.x, dy = ship.y - n.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    n.aggro = d < 900;
    let want = { x: 0, y: 0 };
    if (n.aggro) {
      if (d > 240) want = { x: ux * 160, y: uy * 160 };
      else want = { x: -uy * 150 - ux * (230 - d) * 0.8, y: ux * 150 - uy * (230 - d) * 0.8 };
    }
    n.vx += (want.x - n.vx) * Math.min(1, dt * 2.5);
    n.vy += (want.y - n.vy) * Math.min(1, dt * 2.5);
    n.x += n.vx * dt; n.y += n.vy * dt;
    if (n.aggro) n.hd = Math.atan2(dy, dx);
    else if (Math.hypot(n.vx, n.vy) > 5) n.hd = Math.atan2(n.vy, n.vx);

    const tgt = n.aggro ? enemyTarget(n) : null;
    for (const t of n.turrets) {
      t.flash = Math.max(0, t.flash - dt);
      t.cool -= dt;
      const tp = npcPoint(n, t.x, t.y);
      if (!tgt) continue;
      const wa = Math.atan2(tgt.y - tp.y, tgt.x - tp.x);
      const diff = Math.atan2(Math.sin(wa - t.a), Math.cos(wa - t.a));
      t.a += diff * Math.min(1, dt * 5);
      if (t.cool <= 0 && Math.abs(diff) < 0.3 && dist(tp, tgt) < 320) {
        t.cool = 1.5 + rnd(0, 0.4);
        t.flash = 0.12;
        const sc = CLS[n.cls].sc;
        const m = { x: tp.x + Math.cos(t.a) * 10 * sc, y: tp.y + Math.sin(t.a) * 10 * sc };
        beam(m.x, m.y, tgt.x, tgt.y, '#ff6b6b', 0.2);
        SND.enemyShot();
        const dmg = (4 + n.tier * 2.5) * rnd(0.85, 1.15);
        if (tgt === ship) { if (hitPlayer(dmg)) return; }
        else damageDrone(tgt, dmg);
      }
    }
  }
}

// ============ navigation ============
function gatePos(to) {
  const a = SYS[P.sysId].gates[to];
  return { x: Math.cos(a) * GATE_R, y: Math.sin(a) * GATE_R };
}

function doJump(to) {
  if (P.fuel < JUMP_FUEL) {
    SND.error();
    log('Insufficient fuel for warp. Refuel at a station.');
    R.target = null; R.route = null;
    return false;
  }
  const from = P.sysId;
  P.fuel -= JUMP_FUEL;
  P.sysId = to;
  const a = SYS[to].gates[from];
  ship.x = Math.cos(a) * 1300; ship.y = Math.sin(a) * 1300;
  ship.vx = 0; ship.vy = 0;
  cam.x = ship.x; cam.y = ship.y;
  R.target = null; R.dest = null; R.mining = false;
  recallDrones();
  flash();
  vibe(35);
  SND.warp();
  populate();
  log(`Warped to ${SYS[to].name} (sec ${SYS[to].sec.toFixed(1)}).`);
  save();
  return true;
}

function updateRoute() {
  if (R.route == null) return;
  if (R.route === P.sysId) { R.route = null; log('Arrived at destination.'); return; }
  if (R.target) return;
  const p = path(P.sysId, R.route);
  if (!p || p.length < 2) { R.route = null; return; }
  const to = p[1];
  R.target = { kind: 'gate', to, ref: gatePos(to) };
}

function dock() {
  SND.dock();
  R.target = null; R.dest = null; R.route = null;
  ship.vx = 0; ship.vy = 0;
  save();
  openStation();
}

function updateTarget(dt) {
  const t = R.target;
  if (!t) return;
  const d = Math.hypot(t.ref.x - ship.x, t.ref.y - ship.y);
  const s = st();
  switch (t.kind) {
    case 'ast':
      if (!world.asts.includes(t.ref)) { R.target = null; return; }
      R.dest = t.ref; R.stop = MINE_RANGE * 0.7;
      if (d <= MINE_RANGE) mine(t.ref, dt);
      break;
    case 'npc':
      if (!world.npcs.includes(t.ref)) { R.target = null; return; }
      R.dest = t.ref; R.stop = WEAPON_RANGE * 0.8;
      if (d <= WEAPON_RANGE && R.fireCool <= 0) fireAt(t.ref);
      break;
    case 'station':
      R.dest = { x: 0, y: 0 }; R.stop = 60;
      if (d <= DOCK_RANGE) dock();
      break;
    case 'gate':
      R.dest = t.ref; R.stop = 20;
      if (d <= 70) { R.target = null; doJump(t.to); }
      break;
  }
}

function autoActions(dt) {
  if (R.autoFire) {
    const n = nearestNpc(WEAPON_RANGE);
    if (n && R.fireCool <= 0) fireAt(n);
  }
  if (R.autoMine) {
    const a = nearestAst(MINE_RANGE);
    if (a) mine(a, dt);
  }
}

// ============ ship movement and turrets ============
function shipPoint(x, y) {
  const c = Math.cos(ship.heading), s = Math.sin(ship.heading);
  return { x: ship.x + (x * c - y * s) * SHIP_S, y: ship.y + (x * s + y * c) * SHIP_S };
}
function turretMuzzle() {
  const b = shipPoint(-7, 0);
  return { x: b.x + Math.cos(TUR.a) * 12 * SHIP_S, y: b.y + Math.sin(TUR.a) * 12 * SHIP_S };
}

function joystickSteer(dt) {
  const s = st();
  const accel = s.speed * 1.6;
  const tvx = joy.dx * s.speed * joy.mag, tvy = joy.dy * s.speed * joy.mag;
  ship.vx += clamp(tvx - ship.vx, -accel * dt, accel * dt);
  ship.vy += clamp(tvy - ship.vy, -accel * dt, accel * dt);
}

function updateShip(dt) {
  const s = st();
  const accel = s.speed * 1.3;
  if (!joy.active) {
    let steering = false;
    const d = R.dest;
    if (d) {
      const dx = d.x - ship.x, dy = d.y - ship.y;
      const dd = Math.hypot(dx, dy);
      if (dd > R.stop + 3) {
        steering = true;
        const ux = dx / dd, uy = dy / dd;
        const want = Math.min(s.speed, (dd - R.stop) * 1.6 + 20);
        const tvx = ux * want, tvy = uy * want;
        const ax = tvx - ship.vx, ay = tvy - ship.vy;
        const am = Math.hypot(ax, ay), m = accel * dt;
        if (am > m) { ship.vx += ax / am * m; ship.vy += ay / am * m; }
        else { ship.vx = tvx; ship.vy = tvy; }
      } else if (!R.target) {
        R.dest = null;
      }
    }
    if (!steering) {
      const f = Math.max(0, 1 - dt * 2.5);
      ship.vx *= f; ship.vy *= f;
    }
  }
  ship.x += ship.vx * dt; ship.y += ship.vy * dt;
  const rr = Math.hypot(ship.x, ship.y);
  if (rr > 1900) {
    const k = 1900 / rr;
    ship.x *= k; ship.y *= k; ship.vx *= 0.5; ship.vy *= 0.5;
  }
  if (Math.hypot(ship.vx, ship.vy) > 5) ship.heading = Math.atan2(ship.vy, ship.vx);
}

function angleTo(a, b) { return Math.atan2(Math.sin(b - a), Math.cos(b - a)); }

function updateTurret(dt) {
  // mining turret swivels onto the rock it is working
  const wantM = R.mining && R.mineRef ? Math.atan2(R.mineRef.y - ship.y, R.mineRef.x - ship.x) : ship.heading;
  TUR.a += angleTo(TUR.a, wantM) * Math.min(1, dt * 7);
  // weapon turrets track the pirate we're attacking, or the nearest one when guns are hot
  let wt = null;
  if (R.target && R.target.kind === 'npc') wt = R.target.ref;
  else if (R.autoFire) wt = nearestNpc(WEAPON_RANGE);
  const wantW = wt ? Math.atan2(wt.y - ship.y, wt.x - ship.x) : ship.heading;
  WT.a += angleTo(WT.a, wantW) * Math.min(1, dt * 12);
}

function thrusterFx() {
  const sp = Math.hypot(ship.vx, ship.vy);
  if (sp < 25) return;
  const rx = -Math.cos(ship.heading), ry = -Math.sin(ship.heading);
  const n = sp > 160 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    part(ship.x + rx * 14 + rnd(-2, 2), ship.y + ry * 14 + rnd(-2, 2),
         rx * sp * 0.35 + rnd(-20, 20), ry * sp * 0.35 + rnd(-20, 20),
         0.35, Math.random() < 0.5 ? '#ffb347' : '#ffe0a0', 3);
  }
}

// ============ main step ============
function step(dt) {
  R.time += dt;
  R.mining = false;
  R.fireCool -= dt;
  R.missCool -= dt;
  R.hitFlash -= dt;
  WT.recoil -= dt;
  R.shake *= Math.exp(-dt * 9);
  if (R.shieldDelay > 0) R.shieldDelay -= dt;
  else P.shield = Math.min(st().shMax, P.shield + 10 * dt);
  updateSpawns(dt);
  updateRoute();
  if (joy.active) {
    joystickSteer(dt);
  } else {
    updateTarget(dt);
    autoActions(dt);
  }
  updateShip(dt);
  updateTurret(dt);
  updateDrones(dt);
  updateMissiles(dt);
  stepNpcs(dt);
  thrusterFx();
  SND.engine(Math.min(1, Math.hypot(ship.vx, ship.vy) / st().speed));
  SND.mineSet(R.mining);
  world.beams.forEach(b => b.life -= dt);
  world.beams = world.beams.filter(b => b.life > 0);
  world.rings.forEach(r => r.life -= dt);
  world.rings = world.rings.filter(r => r.life > 0);
  world.texts.forEach(t => { t.life -= dt; t.y -= 26 * dt; });
  world.texts = world.texts.filter(t => t.life > 0);
  updateParts(dt);
  ZOOM = BASEZ * U.zoom;
  cam.x += (ship.x - cam.x) * Math.min(1, dt * 8);
  cam.y += (ship.y - cam.y) * Math.min(1, dt * 8);
  R.saveT += dt;
  if (R.saveT > 5) { R.saveT = 0; save(); }
  R.hudT += dt;
  if (R.hudT > 0.1) { R.hudT = 0; hud(); }
}

// ============ drawing ============
function drawNebula() {
  const neb = nebula(P.sysId);
  const ox = ((-cam.x * 0.03) % 512 + 512) % 512;
  const oy = ((-cam.y * 0.03) % 512 + 512) % 512;
  for (let x = ox - 512; x < W + 512; x += 512) for (let y = oy - 512; y < H + 512; y += 512) {
    ctx.drawImage(neb, x, y, 512, 512);
  }
}

function drawStarLayers() {
  ctx.fillStyle = '#ffffff';
  for (const L of starLayers) {
    for (const s of L.pts) {
      const sx = ((s.x - cam.x * L.f) % TILE + TILE) % TILE;
      const sy = ((s.y - cam.y * L.f) % TILE + TILE) % TILE;
      ctx.globalAlpha = s.a * (0.55 + 0.45 * Math.sin(R.time * s.tw + s.p));
      for (let kx = -1; kx <= 1; kx++) for (let ky = -1; ky <= 1; ky++) {
        const x = sx + kx * TILE, y = sy + ky * TILE;
        if (x < -4 || y < -4 || x > W + 4 || y > H + 4) continue;
        ctx.fillRect(x, y, s.s, s.s);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function polyPath(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
  ctx.closePath();
}
const mirrorY = (pts, k) => pts.map(([x, y]) => [x, y * k]);

function drawPlanet() {
  const p = SYS[P.sysId].planet;
  const g = ctx.createRadialGradient(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.1, p.x, p.y, p.r);
  g.addColorStop(0, p.c1); g.addColorStop(1, p.c2);
  const ag = ctx.createRadialGradient(p.x, p.y, p.r * 0.95, p.x, p.y, p.r * 1.12);
  ag.addColorStop(0, 'rgba(160,210,255,0.25)'); ag.addColorStop(1, 'rgba(160,210,255,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.12, 0, TAU); ctx.fill();
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  if (p.bands) {
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.clip();
    ctx.globalAlpha = 0.2;
    for (let i = 0; i < p.bands; i++) {
      ctx.fillStyle = i % 2 ? p.c1 : p.c2;
      const y = p.y - p.r + (i + 0.5) * (2 * p.r / p.bands);
      ctx.fillRect(p.x - p.r, y, 2 * p.r, p.r * 0.14);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  if (p.ring) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(1, 0.28);
    ctx.strokeStyle = p.ringCol;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = p.r * 0.14;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 1.7, 0, TAU); ctx.stroke();
    ctx.lineWidth = p.r * 0.06;
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 2.05, 0, TAU); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function secColorOf(id) { return secColor(SYS[id].sec); }

function drawGates() {
  const sys = SYS[P.sysId];
  ctx.textAlign = 'center';
  const spin = R.time;
  for (const k in sys.gates) {
    const to = SYS[k];
    const a = sys.gates[k];
    const x = Math.cos(a) * GATE_R, y = Math.sin(a) * GATE_R;
    const col = secColor(to.sec);
    const gg = ctx.createRadialGradient(x, y, 20, x, y, 90);
    gg.addColorStop(0, col); gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.18; ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, y, 90, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin * 0.6);
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.setLineDash([14, 10]);
    ctx.beginPath(); ctx.arc(0, 0, 52, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.rotate(-spin * 1.4);
    ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(0, 0, 36, 0, TAU); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
    if (Math.random() < 0.25) {
      const pa = rnd(0, TAU);
      part(x + Math.cos(pa) * 60, y + Math.sin(pa) * 60, -Math.cos(pa) * 70, -Math.sin(pa) * 70, 0.7, col, 2);
    }
    ctx.fillStyle = col; ctx.font = 'bold 13px system-ui';
    ctx.fillText(to.name, x, y - 66);
    ctx.font = '11px system-ui';
    ctx.fillText('sec ' + to.sec.toFixed(1), x, y + 72);
  }
}

function drawStation() {
  const t = R.time;
  const hg = ctx.createRadialGradient(0, 0, 40, 0, 0, 130);
  hg.addColorStop(0, 'rgba(62,166,255,0.35)'); hg.addColorStop(1, 'rgba(62,166,255,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, 0, 130, 0, TAU); ctx.fill();
  ctx.save();
  ctx.rotate(t / 9);
  ctx.strokeStyle = '#2b4f72'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0, 0, 66, 0, TAU); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    ctx.rotate(TAU / 6);
    ctx.fillStyle = '#284a6c';
    ctx.fillRect(40, -5, 28, 10);
    const on = Math.sin(t * 3 + i) > 0;
    ctx.fillStyle = on ? '#7fffd4' : '#ff6b6b';
    ctx.beginPath(); ctx.arc(68, 0, 3, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#132a42';
  ctx.strokeStyle = '#3ea6ff'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + Math.PI / 8;
    const x = Math.cos(a) * 46, y = Math.sin(a) * 46;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU);
  ctx.fillStyle = '#0a1d31'; ctx.fill();
  ctx.strokeStyle = '#9ee6ff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#9ee6ff'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('STATION', 0, -78);
}

// per-asteroid surface detail, generated once from its position so it stays stable
function asteroidDetail(a) {
  const r = rng(Math.floor(Math.abs(a.x) * 13 + Math.abs(a.y) * 7) + 17);
  const craters = [], veins = [], shards = [], cracks = [];
  const nC = 4 + Math.floor(r() * 5);
  for (let i = 0; i < nC; i++) {
    const ang = r() * TAU, d = r() * a.r * 0.6;
    craters.push({ x: Math.cos(ang) * d, y: Math.sin(ang) * d, r: a.r * (0.08 + r() * 0.14) });
  }
  const nV = 2 + Math.floor(r() * 3);
  for (let i = 0; i < nV; i++) {
    const ang = r() * TAU;
    let x = Math.cos(ang) * a.r * 0.3, y = Math.sin(ang) * a.r * 0.3;
    const line = [[x, y]];
    for (let j = 0; j < 3; j++) {
      x += (r() - 0.5) * a.r * 0.6; y += (r() - 0.5) * a.r * 0.6;
      line.push([x, y]);
    }
    veins.push(line);
  }
  if (ORE[a.ot].crystal) {
    const nS = 5 + Math.floor(r() * 4);
    for (let i = 0; i < nS; i++) {
      const ang = r() * TAU, d = r() * a.r * 0.55;
      shards.push({
        x: Math.cos(ang) * d, y: Math.sin(ang) * d, a: r() * TAU,
        len: a.r * (0.25 + r() * 0.3), w: a.r * (0.08 + r() * 0.06), ph: r() * TAU
      });
    }
  }
  for (let i = 0; i < 6; i++) {
    const ang = r() * TAU;
    const p0 = [Math.cos(ang) * a.r * 0.15, Math.sin(ang) * a.r * 0.15];
    const p1 = [Math.cos(ang + (r() - 0.5)) * a.r * 0.55, Math.sin(ang + (r() - 0.5)) * a.r * 0.55];
    const p2 = [Math.cos(ang + (r() - 0.5) * 0.6) * a.r * 0.95, Math.sin(ang + (r() - 0.5) * 0.6) * a.r * 0.95];
    cracks.push([p0, p1, p2]);
  }
  return { craters, veins, shards, cracks };
}

function drawAsteroids() {
  for (const a of world.asts) {
    if (!a.det) a.det = asteroidDetail(a);
    const D = a.det;
    const O = ORE[a.ot];
    const f = clamp(a.ore / a.max, 0, 1);
    const [hi, mid, lo] = O.col;
    const vein = O.vein;
    const kry = O.crystal;

    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(a.r * 0.3, a.r * 0.35, a.r * 1.05, a.r * 0.9, 0, 0, TAU); ctx.fill();

    ctx.rotate(a.rot);
    ctx.globalAlpha = 0.6 + 0.4 * f;
    const g = ctx.createRadialGradient(a.r * -0.4, a.r * -0.4, a.r * 0.05, 0, 0, a.r * 1.2);
    g.addColorStop(0, hi); g.addColorStop(0.5, mid); g.addColorStop(1, lo);
    polyPath(a.pts); ctx.fillStyle = g; ctx.fill();

    for (let i = 0; i < a.pts.length; i++) {
      const p = a.pts[i], q = a.pts[(i + 1) % a.pts.length];
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.16)';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.closePath(); ctx.fill();
    }

    ctx.save();
    ctx.translate(-0.9, -0.9);
    polyPath(a.pts); ctx.strokeStyle = 'rgba(255,245,220,0.45)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
    polyPath(a.pts); ctx.strokeStyle = lo; ctx.lineWidth = 1.3; ctx.stroke();

    for (const c of D.craters) {
      ctx.fillStyle = 'rgba(20,14,8,0.45)';
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,210,0.22)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(c.x + 0.5, c.y + 0.5, c.r, 0.2 * Math.PI, 1.0 * Math.PI); ctx.stroke();
    }

    ctx.lineCap = 'round';
    for (const v of D.veins) {
      ctx.beginPath();
      v.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      ctx.strokeStyle = `rgba(${vein},${0.1 + 0.2 * f})`; ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = `rgba(${vein},${0.4 + 0.5 * f})`; ctx.lineWidth = 1.3; ctx.stroke();
    }

    if (kry) {
      ctx.globalCompositeOperation = 'lighter';
      for (const s of D.shards) {
        const tw = 0.6 + 0.4 * Math.sin(R.time * 2.5 + s.ph);
        ctx.save();
        ctx.translate(s.x, s.y); ctx.rotate(s.a);
        const cg = ctx.createLinearGradient(0, -s.w, 0, s.w);
        cg.addColorStop(0, `rgba(${vein},${0.9 * tw})`);
        cg.addColorStop(1, `rgba(${vein},0.15)`);
        polyPath([[s.len, 0], [0, -s.w], [-s.len * 0.3, 0], [0, s.w]]);
        ctx.fillStyle = cg; ctx.fill();
        ctx.restore();
        if (tw > 0.92) {
          const tx = s.x + Math.cos(s.a) * s.len, ty = s.y + Math.sin(s.a) * s.len;
          const sg = ctx.createRadialGradient(tx, ty, 0, tx, ty, 5);
          sg.addColorStop(0, 'rgba(255,255,255,0.9)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(tx, ty, 5, 0, TAU); ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    const crackN = Math.round((1 - f) * D.cracks.length);
    ctx.strokeStyle = 'rgba(15,10,5,0.75)'; ctx.lineWidth = 1;
    for (let i = 0; i < crackN; i++) {
      const c = D.cracks[i];
      ctx.beginPath();
      c.forEach((p, j) => (j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      ctx.stroke();
    }

    if (R.mining && R.mineRef === a) {
      const ang = Math.atan2(ship.y - a.y, ship.x - a.x) - a.rot;
      const ix = Math.cos(ang) * a.r * 0.9, iy = Math.sin(ang) * a.r * 0.9;
      const ig = ctx.createRadialGradient(ix, iy, 0, ix, iy, 12);
      ig.addColorStop(0, `rgba(${vein},0.9)`);
      ig.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(ix, iy, 12, 0, TAU); ctx.fill();
    }

    ctx.lineCap = 'butt';
    ctx.globalAlpha = 1;
    if (dist(ship, a) < 320) {
      ctx.strokeStyle = `rgba(${vein},0.55)`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, a.r + 6, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawNpc(n) {
  const C = CLS[n.cls], sc = C.sc;
  ctx.save();
  ctx.translate(n.x, n.y);
  ctx.rotate(n.hd);
  for (const [ex, ey] of C.engines) {
    const eg = ctx.createRadialGradient(ex * sc, ey * sc, 0, ex * sc, ey * sc, 9 * sc);
    eg.addColorStop(0, n.aggro ? 'rgba(255,140,80,0.9)' : 'rgba(255,120,60,0.45)');
    eg.addColorStop(1, 'rgba(255,120,60,0)');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ex * sc, ey * sc, 9 * sc, 0, TAU); ctx.fill();
  }
  ctx.scale(sc, sc);
  const hg = ctx.createLinearGradient(-22, -12, 20, 12);
  hg.addColorStop(0, '#2a1014'); hg.addColorStop(0.5, '#8a3a3a'); hg.addColorStop(1, '#3a1a1e');
  polyPath(C.hull); ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = '#1a0a0c'; ctx.lineWidth = 1.2 / sc; ctx.stroke();
  ctx.strokeStyle = 'rgba(20,6,8,0.7)'; ctx.lineWidth = 0.9 / sc;
  ctx.beginPath(); for (const [x1, y1, x2, y2] of C.seams) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); } ctx.stroke();
  ctx.strokeStyle = n.aggro ? '#ff6b6b' : '#c04848'; ctx.lineWidth = 1.2 / sc;
  ctx.beginPath(); ctx.moveTo(-C.len * 0.6, 0); ctx.lineTo(C.len * 0.4, 0); ctx.stroke();
  ctx.fillStyle = '#ffc2b8';
  ctx.beginPath(); ctx.ellipse(C.cockpit, 0, 2.6, 1.6, 0, 0, TAU); ctx.fill();
  for (const t of n.turrets) {
    const aim = t.a - n.hd;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.fillStyle = '#2a1418';
    ctx.beginPath(); ctx.arc(0, 0, 2.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e0524c'; ctx.lineWidth = 0.9 / sc; ctx.stroke();
    ctx.rotate(aim);
    ctx.fillStyle = '#1a0a0c';
    polyPath([[0, -1.1], [8, -0.8], [8, 0.8], [0, 1.1]]); ctx.fill();
    if (t.flash > 0) {
      const mg = ctx.createRadialGradient(8, 0, 0, 8, 0, 6);
      mg.addColorStop(0, 'rgba(255,220,200,0.95)'); mg.addColorStop(1, 'rgba(255,107,107,0)');
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(8, 0, 6, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
  const bw = 40 * sc, by = n.y - (C.len + 10) * sc;
  ctx.fillStyle = '#3a1212'; ctx.fillRect(n.x - bw / 2, by, bw, 4);
  ctx.fillStyle = '#e0524c'; ctx.fillRect(n.x - bw / 2, by, bw * clamp(n.hp / n.max, 0, 1), 4);
}

function drawDrones() {
  for (const d of world.drones) {
    const col = d.type === 'com' ? '#ffb347' : '#7fffd4';
    if (d.mining && d.tgt) {
      ctx.globalAlpha = 0.6 + 0.3 * Math.sin(R.time * 30);
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.tgt.x, d.tgt.y); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const sp = Math.hypot(d.vx, d.vy);
    const heading = sp > 5 ? Math.atan2(d.vy, d.vx) : d.ang;
    const gl = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, 16);
    gl.addColorStop(0, col); gl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.22; ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(d.x, d.y, 16, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(heading);
    for (const [rx, ry] of [[6, -5], [6, 5], [-6, -5], [-6, 5]]) {
      ctx.save();
      ctx.translate(rx, ry); ctx.rotate(d.rot); ctx.scale(1, 0.3);
      ctx.fillStyle = `rgba(${d.type === 'com' ? '255,179,71' : '127,255,212'},0.35)`;
      ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, TAU); ctx.fill();
      ctx.restore();
    }
    polyPath([[7, 0], [0, -5], [-6, 0], [0, 5]]);
    ctx.fillStyle = '#1b3a57'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(1.5, 0, 1.8, 0, TAU); ctx.fill();
    ctx.restore();
    if (d.hp < 45) {
      ctx.fillStyle = '#3a1212'; ctx.fillRect(d.x - 8, d.y - 14, 16, 3);
      ctx.fillStyle = col; ctx.fillRect(d.x - 8, d.y - 14, 16 * clamp(d.hp / 45, 0, 1), 3);
    }
  }
}

function drawMissiles() {
  for (const m of world.missiles) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.a);
    const L = 10 + Math.sin(m.ph * 60) * 2;
    ctx.fillStyle = 'rgba(255,170,80,0.9)';
    polyPath([[-7, -2], [-7 - L, 0], [-7, 2]]); ctx.fill();
    ctx.fillStyle = 'rgba(255,250,220,0.95)';
    polyPath([[-7, -1], [-7 - L * 0.5, 0], [-7, 1]]); ctx.fill();
    polyPath([[9, 0], [4, -2.6], [-7, -2.6], [-7, 2.6], [4, 2.6]]);
    ctx.fillStyle = '#d8dee9'; ctx.fill();
    ctx.strokeStyle = '#4a5566'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = '#ff6b6b';
    polyPath([[-5, -2.6], [-9, -6], [-8, -2.6]]); ctx.fill();
    polyPath([[-5, 2.6], [-9, 6], [-8, 2.6]]); ctx.fill();
    polyPath([[9, 0], [4, -2.6], [4, 2.6]]); ctx.fill();
    ctx.restore();
  }
}

function drawBeams() {
  ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for (const b of world.beams) {
    const life = clamp(b.life / b.max, 0, 1);
    const p = 1 - life;
    const dx = b.x2 - b.x1, dy = b.y2 - b.y1;
    const head = clamp(p * 2.4, 0, 1);
    const tail = clamp(p * 2.4 - 0.5, 0, 1);
    const hx = b.x1 + dx * head, hy = b.y1 + dy * head;
    const tx = b.x1 + dx * tail, ty = b.y1 + dy * tail;
    ctx.strokeStyle = b.col;
    ctx.globalAlpha = 0.12 * life; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.globalAlpha = 0.35 * life; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.globalAlpha = 0.9 * life; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = life; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    if (p < 0.5) {
      const mr = 6 + (0.5 - p) * 20;
      const mg = ctx.createRadialGradient(b.x1, b.y1, 0, b.x1, b.y1, mr);
      mg.addColorStop(0, b.col); mg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.9 * (1 - p * 2);
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(b.x1, b.y1, mr, 0, TAU); ctx.fill();
    }
    if (head >= 1) {
      const ir = 8 + p * 14;
      const ig = ctx.createRadialGradient(b.x2, b.y2, 0, b.x2, b.y2, ir);
      ig.addColorStop(0, '#ffffff'); ig.addColorStop(0.4, b.col); ig.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = life;
      ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(b.x2, b.y2, ir, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'butt';
  drawMiningBeam();
}

// continuous mining beam: crackling core, traveling energy pulses, glow at the muzzle
function drawMiningBeam() {
  if (!R.mining || !R.mineRef) return;
  const a = R.mineRef;
  const m = turretMuzzle();
  const dx = a.x - m.x, dy = a.y - m.y;
  const L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;
  const pulse = 0.75 + 0.25 * Math.sin(R.time * 30);
  const vein = ORE[a.ot].vein;
  const pts = [];
  for (let i = 0; i <= 8; i++) {
    const t = i / 8;
    const j = (i === 0 || i === 8) ? 0 : rnd(-3, 3);
    pts.push([m.x + dx * t + nx * j, m.y + dy * t + ny * j]);
  }
  const strokePts = () => {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.stroke();
  };
  ctx.lineCap = 'round';
  ctx.strokeStyle = `rgb(${vein})`; ctx.globalAlpha = 0.25 * pulse; ctx.lineWidth = 8; strokePts();
  ctx.globalAlpha = 0.7 * pulse; ctx.lineWidth = 2.4; strokePts();
  ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = pulse; ctx.lineWidth = 1; strokePts();
  for (let i = 0; i < 3; i++) {
    const t = (R.time * 1.6 + i / 3) % 1;
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(m.x + dx * t, m.y + dy * t, 2, 0, TAU); ctx.fill();
  }
  const mg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 7);
  mg.addColorStop(0, `rgba(${vein},0.9)`); mg.addColorStop(1, `rgba(${vein},0)`);
  ctx.globalAlpha = pulse; ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(m.x, m.y, 7, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
}

function drawRingsFx() {
  for (const r of world.rings) {
    const p = 1 - r.life / r.max;
    ctx.globalAlpha = clamp(r.life / r.max, 0, 1);
    ctx.strokeStyle = '#ffd9a0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * p + 8, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParts() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of world.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts() {
  ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center';
  for (const t of world.texts) {
    ctx.globalAlpha = clamp(t.life / t.max, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(t.txt, t.x + 1, t.y + 1);
    ctx.fillStyle = t.col;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

// the player ship: hull, wings with weapon turrets and missile racks, mining turret
function drawShip() {
  const t = R.time, s = st();
  const sp = Math.hypot(ship.vx, ship.vy);
  const boost = clamp(sp / s.speed, 0, 1.2);
  const shFrac = clamp(P.shield / s.shMax, 0, 1);
  const hfrac = clamp(P.hull / s.hullMax, 0, 1);
  const fa = clamp(R.hitFlash * 3, 0, 0.8);

  ctx.save();
  ctx.translate(ship.x, ship.y);

  // shield bubble: hex lattice, world-aligned
  if (shFrac > 0.02 || fa > 0) {
    const SR = 52;
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, SR, 0, TAU); ctx.clip();
    ctx.fillStyle = `rgba(127,217,255,${0.05 * shFrac + fa * 0.2})`;
    ctx.fillRect(-SR - 4, -SR - 4, (SR + 4) * 2, (SR + 4) * 2);
    ctx.strokeStyle = `rgba(127,217,255,${0.22 * shFrac + fa * 0.6})`; ctx.lineWidth = 1;
    const hs = 5;
    for (let r = -9; r <= 9; r++) for (let q = -9; q <= 9; q++) {
      const hx = q * hs * 1.5, hy = (r + q * 0.5) * hs * 1.732;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU;
        const px = hx + Math.cos(a) * hs, py = hy + Math.sin(a) * hs;
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.rotate(t * 0.8);
    ctx.setLineDash([12, 9]); ctx.lineWidth = 2;
    ctx.strokeStyle = `rgba(158,230,255,${0.2 + 0.5 * shFrac + fa * 0.5})`;
    ctx.beginPath(); ctx.arc(0, 0, SR + 1, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  ctx.rotate(ship.heading);
  ctx.scale(SHIP_S, SHIP_S);

  // engine glow and exhaust
  for (const ey of [-10.5, 10.5]) {
    const flick = 0.85 + 0.15 * Math.sin(t * 47 + ey) + Math.random() * 0.08;
    const L = (5 + boost * 16) * flick;
    const gr = 9 + boost * 9;
    const g = ctx.createRadialGradient(-22, ey, 0, -22, ey, gr);
    g.addColorStop(0, `rgba(255,200,120,${0.45 + 0.4 * boost})`);
    g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(-22, ey, gr, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,140,60,0.85)';
    polyPath([[-21, ey - 3], [-21 - L, ey], [-21, ey + 3]]); ctx.fill();
    ctx.fillStyle = 'rgba(255,250,225,0.95)';
    polyPath([[-21, ey - 1.5], [-21 - L * 0.55, ey], [-21, ey + 1.5]]); ctx.fill();
  }

  // engine pods
  for (const k of [-1, 1]) {
    polyPath(mirrorY([[-6, 7], [-16, 7.5], [-22, 9.5], [-22, 12], [-16, 12.5], [-6, 11]], k));
    ctx.fillStyle = '#1d3d5e'; ctx.fill();
    ctx.strokeStyle = '#0a1a2c'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#3ea6ff';
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 4 + k);
    polyPath([[-16, 8.8 * k], [-20, 9.6 * k], [-20, 10.4 * k], [-16, 9.8 * k]]); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0a1622';
    ctx.beginPath(); ctx.ellipse(-21.6, 10.75 * k, 1.1, 2.1, 0, 0, TAU); ctx.fill();
  }

  // swept wings
  for (const k of [-1, 1]) {
    const wg = ctx.createLinearGradient(0, -17 * k, 0, -6 * k);
    wg.addColorStop(0, '#244a6e'); wg.addColorStop(1, '#6ba8d6');
    polyPath(mirrorY([[5, -7.5], [-2, -13], [-9, -17], [-14, -16.5], [-13, -12], [-8, -7.5]], k));
    ctx.fillStyle = wg; ctx.fill();
    ctx.strokeStyle = '#0c1d30'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(12,29,48,0.8)'; ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(2, -9 * k); ctx.lineTo(-10, -14.5 * k);
    ctx.moveTo(-3, -10.5 * k); ctx.lineTo(-11, -10.5 * k);
    ctx.stroke();
    ctx.fillStyle = '#0f2236';
    for (let i = 0; i < 4; i++) {
      const gx = -3 - i * 2.4, gy = (-10 - i * 0.8) * k;
      polyPath([[gx, gy], [gx - 1.3, gy], [gx - 1.3, gy - 1.6 * k], [gx, gy - 1.6 * k]]); ctx.fill();
    }
    // wingtip nav light, alternating blink
    const on = Math.sin(t * 5 + (k > 0 ? Math.PI : 0)) > 0.2;
    const lc = k < 0 ? '255,77,77' : '92,255,138';
    const tipX = -13.5, tipY = -16.2 * k;
    if (on) {
      const g = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 6);
      g.addColorStop(0, `rgba(${lc},0.9)`); g.addColorStop(1, `rgba(${lc},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(tipX, tipY, 6, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = on ? `rgb(${lc})` : '#2a2a2a';
    ctx.beginPath(); ctx.arc(tipX, tipY, 1.3, 0, TAU); ctx.fill();
  }

  // hull
  const hg = ctx.createLinearGradient(-15, -9, 18, 9);
  hg.addColorStop(0, '#22507a'); hg.addColorStop(0.45, '#9fd3f2');
  hg.addColorStop(0.6, '#eef9ff'); hg.addColorStop(1, '#346f9c');
  polyPath([[20, 0], [13, -4], [6, -8], [-4, -9.5], [-12, -8.5], [-15, -4.5], [-15, 4.5], [-12, 8.5], [-4, 9.5], [6, 8], [13, 4]]);
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = '#0b1c2e'; ctx.lineWidth = 1.2; ctx.stroke();
  polyPath([[15, 0], [9, -3.4], [0, -6.2], [-10, -6.2], [-13, -2.2], [-13, 2.2], [-10, 6.2], [0, 6.2], [9, 3.4]]);
  ctx.fillStyle = 'rgba(20,50,80,0.22)'; ctx.fill();
  ctx.strokeStyle = 'rgba(10,28,46,0.6)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.strokeStyle = 'rgba(10,28,46,0.75)'; ctx.lineWidth = 0.7;
  ctx.beginPath();
  for (const [x1, y1, x2, y2] of [[9, -6.5, 6, -3.5], [2, -8.2, 0, -5], [-5, -9.2, -6, -5], [-9, -8, -10, -5.5]]) {
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.moveTo(x1, -y1); ctx.lineTo(x2, -y2);
  }
  ctx.stroke();
  ctx.strokeStyle = `rgba(127,230,255,${0.35 + 0.3 * Math.sin(t * 3)})`;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(13, 0); ctx.stroke();
  polyPath([[-1, -2.5], [-9, -2.2], [-11, -7], [-5, -4.3]]);
  ctx.fillStyle = '#7fb7e0'; ctx.fill();
  ctx.fillStyle = '#0a1a2c';
  for (const vx of [-6, -2.5]) for (const k of [-1, 1]) {
    polyPath([[vx, -5.6 * k], [vx - 1.6, -5.6 * k], [vx - 2.6, -3.9 * k], [vx - 1, -3.9 * k]]); ctx.fill();
  }

  // canopy with a sweeping glint
  const cg = ctx.createLinearGradient(-4, 0, 14, 0);
  cg.addColorStop(0, '#0b2238'); cg.addColorStop(1, '#3fd0ff');
  polyPath([[14, 0], [8, -3.2], [2, -3.8], [-3, -2.8], [-4, 0], [-3, 2.8], [2, 3.8], [8, 3.2]]);
  ctx.fillStyle = cg; ctx.fill();
  ctx.strokeStyle = '#061320'; ctx.lineWidth = 1; ctx.stroke();
  ctx.save();
  polyPath([[14, 0], [8, -3.2], [2, -3.8], [-3, -2.8], [-4, 0], [-3, 2.8], [2, 3.8], [8, 3.2]]); ctx.clip();
  const gx = 12 - ((t * 7) % 18);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  polyPath([[gx, -4], [gx + 2.5, -4], [gx - 3, 4], [gx - 5.5, 4]]); ctx.fill();
  ctx.restore();

  // weapon turrets on each wing root: swivel to the target, recoil on each shot
  const wAim = WT.a - ship.heading;
  const rec = Math.max(0, WT.recoil) * 40;
  for (const k of [-1, 1]) {
    ctx.save();
    ctx.translate(1, -11 * k);
    ctx.fillStyle = '#122a42';
    ctx.beginPath(); ctx.ellipse(0, 0, 4.2, 3.2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#061320'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.rotate(wAim);
    ctx.fillStyle = '#1c3f5e';
    polyPath([[-1, -2.2 - rec * 0.05 * k], [7 - rec, -1.6], [7 - rec, 1.6], [-1, 2.2]]);
    ctx.fill();
    ctx.strokeStyle = '#0a1a2c'; ctx.lineWidth = 0.7; ctx.stroke();
    ctx.fillStyle = '#6ba8d6';
    ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, TAU); ctx.fill();
    if (WT.recoil > 0) {
      const mg = ctx.createRadialGradient(7, 0, 0, 7, 0, 6);
      mg.addColorStop(0, 'rgba(255,255,255,0.95)'); mg.addColorStop(1, 'rgba(158,230,255,0)');
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(7, 0, 6, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // missile racks on the wing trailing edges, tipped when loaded
  for (const k of [-1, 1]) {
    polyPath([[-7, 11.5 * k], [-12, 11.5 * k], [-12, 13.5 * k], [-7, 13.5 * k]]);
    ctx.fillStyle = '#15293d'; ctx.fill();
    ctx.strokeStyle = '#0a1a2c'; ctx.lineWidth = 0.7; ctx.stroke();
    ctx.fillStyle = P.items.missile > 0 ? '#ff8a5c' : '#3a2a2a';
    ctx.beginPath(); ctx.arc(-9.5, 12.5 * k, 1.1, 0, TAU); ctx.fill();
  }

  // mining turret: swivels toward its work, drill spins while mining
  {
    const aim = TUR.a - ship.heading;
    ctx.save();
    ctx.translate(-7, 0);
    ctx.fillStyle = '#16324d';
    ctx.beginPath(); ctx.arc(0, 0, 5.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#0b1c2e'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(127,255,212,0.75)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(0, 0, 4.1, i * TAU / 4 + 0.25, (i + 1) * TAU / 4 - 0.25); ctx.stroke();
    }
    ctx.rotate(aim);
    polyPath([[-2, -3.6], [3, -2.8], [5, -1.4], [5, 1.4], [3, 2.8], [-2, 3.6]]);
    ctx.fillStyle = '#23506f'; ctx.fill();
    ctx.strokeStyle = '#0a1a2c'; ctx.lineWidth = 0.9; ctx.stroke();
    for (const k of [-1, 1]) {
      const y0 = 1.9 * k;
      polyPath([[4, y0 - 0.8], [12, y0 - 0.8], [12, y0 + 0.8], [4, y0 + 0.8]]);
      ctx.fillStyle = '#0f2236'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = R.mining ? '#7fffd4' : '#2a5a6a';
      polyPath([[11, y0 - 0.5], [12.6, y0 - 0.3], [12.6, y0 + 0.3], [11, y0 + 0.5]]); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(14, 0, 2.6, 0, TAU);
    ctx.fillStyle = R.mining ? '#1e6a64' : '#163a48'; ctx.fill();
    ctx.setLineDash([3, 2.5]);
    ctx.lineDashOffset = -R.time * (R.mining ? 60 : 8);
    ctx.strokeStyle = R.mining ? '#b8fff4' : '#4a7a8a'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(14, 0, 2.6, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // hit flash overlay
  if (fa > 0) {
    polyPath([[20, 0], [13, -4], [6, -8], [-4, -9.5], [-12, -8.5], [-15, -4.5], [-15, 4.5], [-12, 8.5], [-4, 9.5], [6, 8], [13, 4]]);
    ctx.fillStyle = `rgba(255,255,255,${fa})`; ctx.fill();
  }
  ctx.restore();

  if (hfrac < 0.4 && Math.random() < 0.2) {
    part(ship.x + rnd(-8, 8), ship.y + rnd(-6, 6), rnd(-30, 30), rnd(-30, 30), 0.35, '#ffb347', 2);
  }
}

function drawTargetRing() {
  if (!R.target) return;
  const t = R.target;
  const r = t.kind === 'ast' ? t.ref.r + 10 : t.kind === 'npc' ? t.ref.size + 10 : t.kind === 'station' ? 76 : 70;
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.arc(t.ref.x, t.ref.y, r, 0, TAU); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawJoystick() {
  ctx.save();
  if (!joy.active) {
    const bx = Math.max(90, W * 0.16), by = H - 150;
    ctx.globalAlpha = 0.25; ctx.strokeStyle = '#9ee6ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, 56, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(158,230,255,0.08)'; ctx.fill();
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#9ee6ff'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('DRAG TO FLY', bx, by + 74);
  } else {
    ctx.globalAlpha = 0.5; ctx.strokeStyle = '#9ee6ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 70, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.7; ctx.fillStyle = '#9ee6ff';
    ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 26, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  const shake = R.shake;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0, 0, W, H);
  drawNebula();
  drawStarLayers();

  ctx.save();
  const sx = shake > 0.2 ? rnd(-shake, shake) : 0;
  const sy = shake > 0.2 ? rnd(-shake, shake) : 0;
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-cam.x, -cam.y);
  drawPlanet();
  drawGates();
  drawStation();
  drawAsteroids();
  for (const n of world.npcs) drawNpc(n);
  drawDrones();
  drawBeams();
  drawMissiles();
  drawRingsFx();
  drawParts();
  drawShip();
  drawTargetRing();
  drawTexts();
  ctx.restore();

  drawVignette();
  drawJoystick();
  drawMini();
}

// ============ minimap ============
function drawMini() {
  const S = mini.width, c = S / 2;
  const MR = 1800, sc = (c - 6) / MR;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, S, S);
  mctx.save();
  mctx.beginPath(); mctx.arc(c, c, c - 2, 0, TAU); mctx.clip();
  mctx.fillStyle = 'rgba(5,7,13,0.85)'; mctx.fillRect(0, 0, S, S);
  const P2 = (x, y) => [c + (x - ship.x) * sc, c + (y - ship.y) * sc];
  for (const k in SYS[P.sysId].gates) {
    const g = gatePos(Number(k));
    let [x, y] = P2(g.x, g.y);
    const dx = x - c, dy = y - c, d = Math.hypot(dx, dy), lim = c - 10;
    if (d > lim) { x = c + dx / d * lim; y = c + dy / d * lim; }
    mctx.fillStyle = secColor(SYS[k].sec);
